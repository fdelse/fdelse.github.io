<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Crea test · Italiano LS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* I cinque livelli come i dorsi di una collana: ogni sezione ha la sua banda
     verticale colorata, e a colpo d'occhio si vede quanta parte del percorso
     il test sta coprendo. Il colore non decora, identifica. */
  .lvl-section{
    margin-bottom:30px;
    border-left:4px solid var(--lvl,var(--line));
    padding-left:16px;
  }
  .lvl-section__head{
    display:flex;align-items:center;gap:12px;margin:0 0 12px -20px;
  }
  .lvl-section__title{
    font-family:var(--display);font-weight:600;font-size:15.5px;margin:0;
    display:inline-flex;align-items:baseline;gap:8px;
    background:var(--lvl,var(--ink));color:#fff;
    padding:6px 14px 7px;border-radius:0 8px 8px 0;
    letter-spacing:.01em;
  }
  .lvl-section__title .sigla{
    font-family:var(--sans);font-weight:700;font-size:12.5px;
    letter-spacing:.09em;opacity:.85;
  }
  .lvl-section__actions{margin-left:auto;display:flex;gap:6px;}
  .lvl-section__conta{
    font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;
  }
  .mini{
    font-size:12px;font-weight:600;padding:5px 11px;border-radius:7px;
    background:transparent;border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;
  }
  .mini:hover{background:var(--line-soft);}
  .check-row{
    display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:8px;
    cursor:pointer;border:1px solid var(--line);background:var(--card);margin-bottom:5px;
    transition:background .12s, border-color .12s;
  }
  .check-row:hover{border-color:var(--lvl,var(--ink-faint));}
  /* La riga scelta si tinge del colore del suo livello: la selezione si legge
     senza dover cercare la casella spuntata. */
  .check-row.on{
    background:var(--velo,var(--line-soft));
    border-color:var(--lvl,var(--ink));
  }
  .check-row.on .num{color:var(--lvl,var(--ink));font-weight:700;}
  .check-row.on .ttl{font-weight:600;}
  .check-row input{width:18px;height:18px;accent-color:var(--lvl,var(--ink));cursor:pointer;flex:none;}
  .check-row .num{font-variant-numeric:tabular-nums;color:var(--ink-faint);font-size:12.5px;width:26px;flex:none;}
  .check-row .ttl{font-size:14.5px;flex:1;}
  /* Le lezioni possono essere molte («B2 L26 · C1 L1 · C1 L9 · C1 L16 · C1 L21»):
     senza andare a capo allargavano la pagina e su telefono la sbordavano. */
  .check-row .exn{font-size:11.5px;color:var(--ink-faint);text-align:right;}
  @media (max-width:600px){
    /* Su schermo stretto le lezioni vanno sotto il titolo, non di fianco. */
    .check-row{flex-wrap:wrap;}
    .check-row .ttl{flex:1 1 100%;order:2;}
    .check-row .exn{flex:1 1 100%;order:3;text-align:left;padding-left:38px;}
  }
  .counter-bar{
    position:sticky;top:0;z-index:10;background:var(--paper);
    padding:14px 0 16px;border-bottom:1px solid var(--line);margin-bottom:24px;
    display:flex;flex-direction:column;gap:12px;
  }
  .counter-bar__riga{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .counter-bar__riga--controlli{gap:20px;}
  .counter-bar .stat{display:flex;align-items:baseline;gap:6px;}
  .counter-bar .stat b{
    font-family:var(--display);font-size:26px;font-weight:600;color:var(--ink);
    font-variant-numeric:tabular-nums;line-height:1;
  }
  .counter-bar .stat span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;}
  .conto{
    font-size:12.5px;color:var(--ink-soft);font-style:italic;
    margin:-4px 0 2px;font-variant-numeric:tabular-nums;
  }
  .counter-bar .n-select{display:flex;align-items:center;gap:8px;}
  .counter-bar .n-select label{font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.07em;}
  .counter-bar .n-select select{font-family:var(--sans);font-size:14px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);}
  .mini--preset{
    border-color:var(--azione);color:var(--azione);font-weight:700;padding:8px 14px;
  }
  .mini--preset:hover{background:var(--azione);color:#fff;border-color:var(--azione);}
  /* Contorno più marcato del grigio chiaro degli altri «mini»: è un comando
     distruttivo, deve leggersi come tale senza per questo gridare in colore. */
  .mini--clear{border-color:var(--ink-faint);color:var(--ink);}
  .mini--clear:hover{border-color:var(--ink-soft);background:var(--line-soft);}
  /* I due comandi che agiscono sull'intera selezione stanno insieme, impilati
     e spinti a destra: sono di natura diversa dai selettori a sinistra, che
     riguardano una porzione del programma. */
  .counter-bar .n-select--globali{
    flex-direction:column;align-items:stretch;gap:6px;margin-left:auto;
  }
  .warn-long{color:var(--warn-ink);font-size:12.5px;font-weight:600;display:none;}
  .warn-long.show{display:inline;}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Generatore di test</p>
  <h1>Scegli le <em>strutture</em> del test</h1>
  <p class="sub">Spunta le strutture da includere — anche non consecutive. Poi genera il link e mandalo allo studente.</p>

  <div class="counter-bar">
    <div class="counter-bar__riga">
      <div class="stat"><b id="cStruct">0</b><span>strutture</span></div>
      <div class="stat"><b id="cItems">0</b><span>domande</span></div>
      <div class="stat"><span class="warn-long" id="warnLong">test lungo — valuta di spezzarlo</span></div>
    </div>
    <div class="conto" id="contoSpieg"></div>
    <div class="counter-bar__riga counter-bar__riga--controlli">
    <div class="n-select">
      <label for="da">Dalla lezione</label>
      <select id="da"><option value="">inizio</option></select>
    </div>
    <div class="n-select">
      <label for="a">Alla lezione</label>
      <select id="a"><option value="">fine</option></select>
    </div>
    <div class="n-select n-select--globali">
      <button class="mini mini--preset" id="preset">Test di posizionamento</button>
      <button class="mini mini--clear" id="clearAll">Togli in tutti i livelli</button>
    </div>
    <div class="n-select">
      <label for="n">Domande per esercizio</label>
      <select id="n" title="Ogni struttura ha 3 esercizi da 6 item. Questo numero dice quante domande pescare da ciascuno: con 2 fanno 6 domande per struttura. Le domande sono estratte a caso, così due sessioni dello stesso test non hanno le stesse frasi. Con «tutti i quesiti» l'estrazione non avviene: escono tutti e 6, ed è il modo per rileggere la banca dallo schermo dello studente.">
        <option value="1">1 — test rapido</option>
        <option value="2" selected>2 — equilibrato</option>
        <option value="3">3 — approfondito</option>
        <option value="4">4 — molto esteso</option>
        <option value="6">6 — tutti i quesiti (per correggere)</option>
      </select>
    </div>
    </div>
  </div>

  <div id="list"></div>

  <div class="card" style="text-align:center;margin-top:20px;">
    <button id="gen" disabled>Genera link test</button>
  </div>

  <div class="card" id="linkCard" style="display:none;">
    <p class="kicker">Link da inviare allo studente</p>
    <div class="link-box">
      <input type="text" id="linkOut" readonly>
      <button class="ghost" id="copyBtn">Copia</button>
    </div>
    <p class="note" id="linkNote"></p>
  </div>
</div>

<script src="test-data.js"></script>
<script>
const LVL_COLOR = {a:"var(--c-a)", a2:"var(--c-a2)", b1:"var(--c-b1)", b2:"var(--c-b2)", c1:"var(--c-c1)"};
const LVL_VELO  = {a:"var(--c-a-velo)", a2:"var(--c-a2-velo)", b1:"var(--c-b1-velo)", b2:"var(--c-b2-velo)", c1:"var(--c-c1-velo)"};
const LVL_TAG   = {a:"A1", a2:"A2", b1:"B1", b2:"B2", c1:"C1"};
const LVL_NAME  = {a:"Fondamenta", a2:"Elementare", b1:"Intermedio", b2:"Intermedio-avanzato", c1:"Avanzato"};
const LVL_ORDER = ["a","a2","b1","b2","c1"];

const nSel = document.getElementById('n');
const list = document.getElementById('list');
const genBtn = document.getElementById('gen');

const byLevel = {};
TEST_STRUCTURES.forEach((s, gi) => {
  (byLevel[s.lvl] = byLevel[s.lvl] || []).push({ s, gi });
});

LVL_ORDER.forEach(lvl => {
  if (!byLevel[lvl]) return;
  const section = document.createElement('div');
  section.className = 'lvl-section';
  section.style.setProperty('--lvl', LVL_COLOR[lvl]);
  section.style.setProperty('--velo', LVL_VELO[lvl]);
  const head = document.createElement('div');
  head.className = 'lvl-section__head';
  head.innerHTML =
    '<h2 class="lvl-section__title"><span class="sigla">' + LVL_TAG[lvl] + '</span> ' + LVL_NAME[lvl] + '</h2>' +
    '<span class="lvl-section__conta" data-conta="' + lvl + '"></span>' +
    '<div class="lvl-section__actions">' +
      '<button class="mini" data-toggle="' + lvl + '">Spunta tutto ' + LVL_TAG[lvl] + '</button>' +
    '</div>';
  section.appendChild(head);
  byLevel[lvl].forEach(({ s, gi }) => {
    const row = document.createElement('label');
    row.className = 'check-row';
    row.style.setProperty('--lvl', LVL_COLOR[lvl]);
    row.style.setProperty('--velo', LVL_VELO[lvl]);
    const exCount = s.exercises.length;
    const lez = (s.lez && s.lez.length) ? s.lez.join(' · ') : '—';
    // se la struttura pesa su un livello diverso nel calcolo, lo segnalo
    const nota = s.stima ? ' · calcolato come ' + LVL_TAG[s.stima] : '';
    row.innerHTML =
      '<input type="checkbox" data-gi="' + gi + '" data-ex="' + exCount + '">' +
      // Numero = indice interno della banca, non posizione nell'elenco: è lo
      // stesso che compare nel campo «s=» del link e che usano dump.js e
      // controlla.js. Prima qui c'era «gi + 1», e le due numerazioni sfasate
      // di uno portavano a spuntare la struttura sbagliata.
      '<span class="num">' + gi + '</span>' +
      '<span class="ttl">' + s.title + '</span>' +
      '<span class="exn">' + lez + nota + '</span>';
    section.appendChild(row);
  });
  list.appendChild(section);
});

const checkboxes = () => Array.from(document.querySelectorAll('input[type=checkbox]'));

/* ---------- selettore «fino alla lezione X» ----------
   Ogni struttura porta le lezioni in cui la insegni (campo lez, es. "A1 L5").
   La lezione di INTRODUZIONE è la più bassa fra quelle elencate: è lì che la
   struttura va considerata "vista". Scegliendo una lezione si spuntano tutte
   le strutture introdotte fino a quel punto — comprese quelle dei livelli
   precedenti, perché lo studente le ha già incontrate. */
const ORD_LIV = { 'A0':0, 'A1':1, 'A2':2, 'B1':3, 'B2':4, 'C1':5 };

function leggiLezione(txt){
  const m = /^([ABC][012])\s*L\s*(\d+)$/i.exec(txt.trim());
  if (!m) return null;
  const liv = m[1].toUpperCase();
  if (!(liv in ORD_LIV)) return null;
  return { liv: liv, n: parseInt(m[2]), peso: ORD_LIV[liv] * 1000 + parseInt(m[2]) };
}
function introDi(s){
  const l = (s.lez || []).map(leggiLezione).filter(Boolean);
  if (!l.length) return Infinity;
  return Math.min.apply(null, l.map(x => x.peso));
}

// elenco ordinato delle lezioni presenti nella banca
const lezioniDisponibili = (() => {
  const m = new Map();
  TEST_STRUCTURES.forEach(s => (s.lez || []).forEach(t => {
    const p = leggiLezione(t);
    if (p) m.set(p.peso, p.liv + ' L' + p.n);
  }));
  return Array.from(m.entries()).sort((a,b) => a[0]-b[0]);
})();

const daSel = document.getElementById('da');
const aSel  = document.getElementById('a');
lezioniDisponibili.forEach(([peso, etichetta]) => {
  [daSel, aSel].forEach(sel => {
    const o = document.createElement('option');
    o.value = peso; o.textContent = etichetta;
    sel.appendChild(o);
  });
});

/* Spunta le strutture introdotte nell'intervallo scelto.
   «Dalla lezione» vuoto = dall'inizio; «Alla lezione» vuoto = fino alla fine.
   Così si può fare sia un piazzamento (dall'inizio a una lezione alta) sia un
   test di progresso su un blocco (es. dalla A2 L10 alla A2 L20). */
function applicaIntervallo(){
  if (!daSel.value && !aSel.value) return;
  let min = daSel.value ? parseInt(daSel.value) : -Infinity;
  let max = aSel.value  ? parseInt(aSel.value)  : Infinity;
  if (min > max) { const t = min; min = max; max = t; }   // se invertiti, li scambia
  checkboxes().forEach(c => {
    const s = TEST_STRUCTURES[parseInt(c.dataset.gi)];
    const p = introDi(s);
    c.checked = (p >= min && p <= max);
  });
  update();
}
daSel.addEventListener('change', () => { presetAttivo = false; applicaIntervallo(); });

/* ---------- preset «Test di posizionamento» ----------
   Un test d'ingresso deve essere corto e diagnostico: non serve coprire tutto
   il programma, servono poche strutture per livello scelte fra quelle che
   separano davvero i livelli (es. l'accordo dell'aggettivo, il -ISC-, piacere,
   a/in con città e paesi, il congiuntivo nelle concessive, l'ipotetico misto).
   Le strutture adatte sono marcate con diag:true nella banca.
   Il preset imposta anche 1 item per esercizio: serve collocare, non misurare
   a fondo, e un test breve si porta a termine con più attenzione. */
/* presetAttivo: se il link nasce dal preset, il test avrà l'arresto anticipato
   (adatt=1). Qualsiasi modifica manuale lo disattiva, perché in un test di
   progresso l'interruzione falserebbe il confronto fra due sessioni. */
let presetAttivo = false;
document.getElementById('preset').addEventListener('click', e => {
  e.preventDefault();
  daSel.value = ''; aSel.value = '';
  checkboxes().forEach(c => {
    c.checked = !!TEST_STRUCTURES[parseInt(c.dataset.gi)].diag;
  });
  nSel.value = '1';
  presetAttivo = true;
  update();
});

aSel.addEventListener('change', () => { presetAttivo = false; applicaIntervallo(); });



function update(){
  const n = parseInt(nSel.value);
  const checked = checkboxes().filter(c => c.checked);
  const nStruct = checked.length;
  const nItems = checked.reduce((sum, c) => sum + parseInt(c.dataset.ex) * n, 0);
  document.getElementById('cStruct').textContent = nStruct;
  document.getElementById('cItems').textContent = nItems;
  document.getElementById('warnLong').classList.toggle('show', nItems > 60);
  /* Il conto esplicito: senza, «2 item per esercizio» non dice quante domande
     lo studente si troverà davvero davanti. */
  document.getElementById('contoSpieg').textContent = nStruct
    ? nStruct + ' strutture × 3 esercizi × ' + n + ' = ' + nItems + ' domande'
    : '';
  genBtn.disabled = (nStruct === 0);
  checkboxes().forEach(c => c.closest('.check-row').classList.toggle('on', c.checked));

  /* Quante strutture per livello: dice se il test è bilanciato o pende tutto
     da una parte — cosa che il totale da solo non mostra. */
  document.querySelectorAll('[data-conta]').forEach(el => {
    const lvl = el.dataset.conta;
    const tot = byLevel[lvl].length;
    const sel = byLevel[lvl].filter(({ gi }) =>
      document.querySelector('input[data-gi="' + gi + '"]').checked).length;
    el.textContent = sel ? sel + ' di ' + tot : '';
  });
}

list.addEventListener('change', e => {
  if (e.target.matches('input[type=checkbox]')) { presetAttivo = false; update(); }
});
list.addEventListener('click', e => {
  /* Un solo pulsante per livello, che funziona a interruttore: se il livello è
     già tutto spuntato lo svuota, altrimenti lo riempie. Prima erano due
     pulsanti per sezione; con il «togli» generale spostato nella barra in alto,
     tenere qui anche un «togli» per livello avrebbe fatto tre comandi per una
     scelta che è binaria. */
  const lvl = e.target.dataset.toggle;
  if (lvl === undefined) return;
  e.preventDefault();
  const caselle = byLevel[lvl].map(({ gi }) => document.querySelector('input[data-gi="' + gi + '"]'));
  const tutteSpuntate = caselle.every(c => c.checked);
  caselle.forEach(c => { c.checked = !tutteSpuntate; });
  presetAttivo = false;
  update();
});

/* Svuota l'intera selezione, tutti i livelli insieme: sta nella barra in alto
   perché è un comando che agisce su tutto, come il preset. */
document.getElementById('clearAll').addEventListener('click', () => {
  document.querySelectorAll('#list input[type=checkbox]').forEach(c => { c.checked = false; });
  presetAttivo = false;
  update();
});
nSel.addEventListener('change', () => { presetAttivo = false; update(); });

genBtn.addEventListener('click', () => {
  const n = nSel.value;
  const ids = checkboxes().filter(c => c.checked).map(c => c.dataset.gi);
  // costruisce l'URL di test.html nella stessa cartella,
  // qualunque sia il nome di questa pagina (index.html, builder.html, ecc.)
  const base = location.href.split('?')[0].split('#')[0].replace(/[^\/]*$/, '') + 'test.html';
  const url = base + '?s=' + ids.join(',') + '&n=' + n + (presetAttivo ? '&adatt=1' : '');
  document.getElementById('linkOut').value = url;
  document.getElementById('linkNote').textContent =
    ids.length + ' strutture \u00b7 ' + document.getElementById('cItems').textContent + ' domande in tutto.' +
    (presetAttivo ? ' Test di posizionamento: si interrompe quando un livello scende sotto il 50%.' : '');
  document.getElementById('linkCard').style.display = 'block';
  document.getElementById('linkCard').scrollIntoView({behavior:'smooth', block:'center'});
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const inp = document.getElementById('linkOut');
  inp.select();
  navigator.clipboard.writeText(inp.value);
  const btn = document.getElementById('copyBtn');
  const old = btn.textContent;
  btn.textContent = 'Copiato \u2713';
  setTimeout(()=>btn.textContent = old, 1500);
});

update();
</script>
</body>
</html>
