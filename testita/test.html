<style>
  .pagewrap{display:none;}
  .pagewrap.active{display:block;}
  .navbar{
    position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
    padding:16px 0;display:flex;justify-content:space-between;align-items:center;margin-top:8px;
  }
  .navbar .spacer{flex:1;}

  /* scelta multipla a bottoni */
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .opt{
    font-family:var(--sans);font-size:14.5px;padding:8px 14px;border-radius:8px;
    border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;
  }
  .opt:hover{background:#fbeee7;border-color:var(--lvl,var(--ink));color:var(--ink);}
  .opt.sel, .opt.sel:hover{background:var(--lvl,var(--ink));color:#fff;border-color:var(--lvl,var(--ink));}

  /* "individua l'errore": parole cliccabili */
  .words{margin-top:6px;line-height:2.1;}
  .word{
    display:inline;padding:3px 3px;border-radius:6px;cursor:pointer;
    border:1.5px solid transparent;
  }
  .word:hover{background:var(--line-soft);}
  .word.sel{background:var(--lvl,var(--ink));color:#fff;}
  .hint{font-size:12.5px;color:var(--ink-faint);margin-top:6px;font-style:italic;}

  /* formato "clicca per comporre" */
  .composta{
    min-height:46px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    border:1.5px dashed var(--line);border-radius:9px;padding:9px 11px;margin:8px 0 10px;
    background:var(--paper);
  }
  .composta__vuota{color:var(--ink-faint);font-style:italic;}
  .parole-tray{display:flex;flex-wrap:wrap;gap:7px;}
  .tok{
    font-family:var(--sans);font-size:14.5px;padding:7px 13px;border-radius:8px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  }
  .tok:hover{background:#fbeee7;border-color:var(--lvl,var(--ink));}
  .tok--messa{background:var(--lvl,var(--ink));color:#fff;border-color:var(--lvl,var(--ink));}
  .tok--messa:hover{background:var(--lvl,var(--ink));color:#fff;}
  .mini-annulla{
    font-size:12px;font-weight:600;padding:5px 11px;border-radius:7px;margin-top:8px;
    background:transparent;border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;
    display:block;margin-left:auto;   /* allineato a destra */
  }
  .mini-annulla:hover{background:var(--line-soft);}

  /* spazio vuoto nella frase: vuoto = tratteggiato, riempito = parola evidenziata */
  .gap{
    display:inline-block;min-width:96px;text-align:center;
    color:var(--ink-faint);font-weight:600;letter-spacing:1px;
    border-bottom:2px solid var(--line);padding:0 6px;margin:0 3px;
    transition:background .15s, color .15s;
  }
  .gap.filled{
    color:var(--ink);background:transparent;font-weight:400;
    border-bottom-color:var(--lvl,var(--ink));
    letter-spacing:0;padding:0 6px;
  }
</style>

<script>
const LVL_COLOR = {a:"var(--c-a)", a2:"var(--c-a2)", b1:"var(--c-b1)", b2:"var(--c-b2)", c1:"var(--c-c1)"};
const LVL_TAG   = {a:"A1", a2:"A2", b1:"B1", b2:"B2", c1:"C1"};

/* Locuzioni che nel formato «errore» valgono come un blocco unico: cliccandone
   una parola si selezionano tutte. Metà servono al meccanismo (là dove la
   correzione cambia il numero di parole), metà a fare da zavorra, perché un
   blocco che comparisse solo sugli errori sarebbe la risposta.
   Prima di aggiungerne una, verificare che non sia bersaglio in nessun item. */
const LOCUZIONI = [
  'due giorni fa', "l'anno scorso",
  'ci sono', 'ci sarà', 'poco fa', 'ogni giorno', 'in fretta', 'per favore',
  'a piedi', 'a casa', 'in centro', 'al mare',
  'prima che', 'dopo che', 'prima di'
];

const params = new URLSearchParams(location.search);
const nRaw = parseInt(params.get('n') ?? '2');
const nPick = Number.isFinite(nRaw) ? Math.max(1, Math.min(4, nRaw)) : 2; // il builder usa 1-4
/* adatt=1 → arresto anticipato: il test si chiude quando un livello scende sotto
   la soglia. Lo attiva solo il preset «Test di posizionamento»: in un test di
   progresso servono sempre tutte le domande, altrimenti i punteggi di due
   sessioni diverse non sono confrontabili. */
const adattivo = params.get('adatt') === '1';
const seedParam = params.get('seed');                      // opzionale: fissa la pesca

// strutture selezionate (nuovo formato s=0,3,7 ; retrocompat from/to)
let indices;
if (params.get('s')) {
  indices = params.get('s').split(',').map(x => parseInt(x)).filter(x => !isNaN(x));
} else {
  const from = parseInt(params.get('from') ?? '0');
  const to = parseInt(params.get('to') ?? (TEST_STRUCTURES.length - 1));
  indices = [];
  for (let i = from; i <= to; i++) indices.push(i);
}

/* ---------- PRNG con seed (così un link può essere riproducibile se serve) ---------- */
function makeRng(seed){
  let s = seed >>> 0;
  return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
const rng = makeRng(seedParam ? parseInt(seedParam) : (Date.now() & 0xffffffff));
function pickRandom(arr, k){
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, Math.min(k, copy.length));
}

/* ---------- anti-collisione tra esercizi ----------
   I tre esercizi di una struttura sono costruiti su frasi affini: se il
   sorteggio pesca la stessa frase in due esercizi diversi, uno rivela la
   risposta dell'altro (es. il buco "Se ___ di più..." e, tra le opzioni
   della Trasformazione, la stessa frase già completata).
   Qui si confrontano le frasi degli item e si scartano quelle troppo simili
   a una già scelta nella stessa struttura. Con 6 item in banca c'è un buon
   margine soprattutto quando se ne pescano 1-3; con 4 il margine si riduce.
   Se proprio non bastasse si ripiega sugli scarti, così il test non resta mai incompleto. */
function paroleDi(txt){
  return txt.toLowerCase()
    .replace(/___+/g, ' ').replace(/→/g, ' ')
    .replace(/\([^)]*\)/g, ' ')
    .replace(/[.,;:!?«»'’"]/g, ' ')
    .split(/\s+/).filter(Boolean);
}
function frasiDi(item){
  const f = [item.q];
  if (item.options) item.options.forEach(o => { if (paroleDi(o).length >= 3) f.push(o); });
  return f.map(t => new Set(paroleDi(t)));
}
function jaccard(a, b){
  let inter = 0;
  a.forEach(w => { if (b.has(w)) inter++; });
  return inter / (a.size + b.size - inter);
}
// quanto un item somiglia al più simile di quelli già scelti (0 = nessuna affinità)
function somiglianzaMax(cand, giaScelti){
  const fc = frasiDi(cand);
  let max = 0;
  for (const altro of giaScelti) {
    for (const y of frasiDi(altro)) {
      for (const x of fc) {
        const s = jaccard(x, y);
        if (s > max) max = s;
      }
    }
  }
  return max;
}
function pescaSenzaCollisioni(pool, k, giaScelti){
  const mescolato = pickRandom(pool, pool.length);   // stesso PRNG: resta riproducibile col seed
  const scelti = [];
  for (let n = 0; n < k && mescolato.length; n++) {
    let idxMigliore = 0, peggiore = Infinity;
    for (let i = 0; i < mescolato.length; i++) {
      const s = somiglianzaMax(mescolato[i], giaScelti.concat(scelti));
      if (s < peggiore) { peggiore = s; idxMigliore = i; }
      if (peggiore === 0) break;      // nessuna affinità: non si può fare meglio
    }
    scelti.push(mescolato.splice(idxMigliore, 1)[0]);
  }
  return scelti;
}

/* costruisce il test pescando nPick item a caso da ogni esercizio */
const selected = indices.map(i => TEST_STRUCTURES[i]).filter(Boolean).map(s => {
  const usati = [];   // item già scelti in questa struttura, per evitare doppioni
  const exercises = s.exercises.map(e => {
    const items = pescaSenzaCollisioni(e.items, nPick, usati);
    usati.push(...items);
    // «testo» va portato dietro: è il brano dell'esercizio di comprensione,
    // stampato una volta sola in cima e non ripetuto su ogni item.
    return { type: e.type, fmt: e.fmt || 'fill', instr: e.instr, testo: e.testo, items: items };
  });
  // NB: vanno copiati anche stima e lez: servono al calcolo e al riepilogo finale.
  return { lvl: s.lvl, stima: s.stima, lez: s.lez, title: s.title, exercises: exercises };
});

let studentName = '';
let currentPage = 0;
let rangeDomande = [];   // per ogni pagina: {da, a, tot} — numerazione progressiva
let pagineViste = new Set();   // pagine effettivamente mostrate (per l'arresto anticipato)
let arrestoAnticipato = null;  // livello su cui il test si è fermato
const totalPages = selected.length;

/* ---------- normalizzazione per correzione fill ---------- */
function normalizeText(str){
  return str.toLowerCase()
    .replace(/\([^)]*\)/g, '')
    .replace(/[.,;:!?"'’]/g, '')
    .replace(/\s+/g, ' ').trim();
}
/* ---------- correzione dei buchi digitati ----------
   Un refuso non deve valere come errore di grammatica, ma in italiano la
   desinenza È la grammatica: parlo/parla, fosse/fossi, dico/dice differiscono
   di una lettera e sono forme diverse. Quindi:
     · l'errore dentro la parola si perdona (finamo, prefeisco, dorimamo)
     · la differenza nelle ultime due lettere no
     · le forme errate note (campo "no" dell'item) sono respinte comunque
     · gli accenti si ignorano, per non penalizzare chi non ha la tastiera italiana */
function normParola(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
          .replace(/[^a-z']/g,'');
}
// distanza di Damerau-Levenshtein: conta anche lo scambio di due lettere vicine
function distanza(a, b){
  const d = [];
  for (let i = 0; i <= a.length; i++){ d[i] = []; for (let j = 0; j <= b.length; j++) d[i][j] = (i===0? j : (j===0? i : 0)); }
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++){
    const c = a[i-1] === b[j-1] ? 0 : 1;
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+c);
    if (i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2]+1);
  }
  return d[a.length][b.length];
}
function parolaCorretta(scritto, giusta, forme){
  const a = normParola(scritto), b = normParola(giusta);
  if (!a) return false;
  if (a === b) return true;
  if ((forme||[]).some(f => normParola(f) === a)) return false;   // forma errata nota
  if (b.length >= 5 && distanza(a,b) <= 1 && a.slice(-2) === b.slice(-2)) return true;
  return false;
}
function fillCorrect(userVal, ans, forme){
  // ans può avere alternative con "|" e/o buchi multipli con "/"
  if (!userVal || !userVal.trim()) return null; // null = non risposto
  const parts = ans.split('/').map(p => p.trim());
  const userParts = userVal.split('/').map(p => p.trim());
  if (parts.length > 1) {
    if (userParts.length !== parts.length) return false;
    return parts.every((p, i) =>
      p.split('|').some(alt => parolaCorretta(userParts[i], alt, forme)));
  }
  return ans.split('|').some(alt => parolaCorretta(userVal, alt, forme));
}

/* ---------- avvio ---------- */
document.getElementById('startBtn').addEventListener('click', () => {
  const val = document.getElementById('studentName').value.trim();
  if (!val) { document.getElementById('studentName').focus(); return; }
  studentName = val;
  document.getElementById('namegateWrap').style.display = 'none';
  document.getElementById('testWrap').style.display = 'block';
  renderAllPages();
  showPage(0);
});

/* ---------- rendering per formato ---------- */
function renderItem(itemData, fmt, refId, posBersaglio){
  const box = document.createElement('div');
  box.className = 'item';
  box.dataset.fmt = fmt;
  box.dataset.ref = refId;

  const num = document.createElement('span');
  num.className = 'item__num';
  num.textContent = itemData._n;
  box.appendChild(num);

  const body = document.createElement('div');
  body.className = 'item__body';

  if (fmt === 'fill') {
    box.dataset.answer = itemData.a;
    if (itemData.no) box.dataset.no = JSON.stringify(itemData.no);   // forme errate note
    const parts = itemData.q.split('___');
    let html = '<div class="item__text">';
    if (parts.length > 1) {
      html += parts.map((p, i) => p + (i < parts.length - 1 ? '<input class="blank" type="text">' : '')).join('');
    } else {
      html += itemData.q + '<br><input class="blank" type="text" style="width:100%;max-width:340px;">';
    }
    html += '</div>';
    body.innerHTML = html;
  }
  else if (fmt === 'buco') {
    /* Le opzioni si mescolano: in banca la risposta giusta è quasi sempre la
       prima, e senza mescolamento basterebbe cliccare sempre il primo bottone.
       Stesso PRNG del resto del test: col seed la sequenza resta riproducibile. */
    const mescolate = pickRandom(
      itemData.options.map((op, i) => ({ op, i })),
      itemData.options.length
    );
    /* Il solo mescolamento casuale, su tre o quattro item, ammucchia spesso la
       risposta giusta sullo stesso bottone. Se l'esercizio ha assegnato una
       posizione bersaglio, ce la si porta con uno scambio: i distrattori
       restano mescolati, ma le posizioni giuste risultano distribuite. */
    if (typeof posBersaglio === 'number') {
      const dov = mescolate.findIndex(o => o.i === itemData.answer);
      const p = posBersaglio % mescolate.length;
      if (dov !== p) { const t = mescolate[dov]; mescolate[dov] = mescolate[p]; mescolate[p] = t; }
    }
    box.dataset.answer = mescolate.findIndex(o => o.i === itemData.answer);
    const parts = itemData.q.split('___');
    let html = '<div class="item__text">' + parts.join('<span class="gap" data-gap>_____</span>') + '</div>';
    html += '<div class="opts">';
    mescolate.forEach((o, i) => {
      html += '<button type="button" class="opt" data-i="' + i + '">' + o.op + '</button>';
    });
    html += '</div>';
    body.innerHTML = html;
  }
  else if (fmt === 'ordina') {
    box.dataset.answer = JSON.stringify(itemData.sol);
    if (itemData.alt) box.dataset.alt = JSON.stringify(itemData.alt);
    // le parole si mescolano con lo stesso PRNG del test: col seed resta riproducibile
    const mescolate = pickRandom(itemData.sol.slice(), itemData.sol.length);
    let html = '<div class="hint">' + (itemData.q || 'Clicca le parole nell\'ordine giusto:') + '</div>';
    html += '<div class="composta" data-composta><span class="composta__vuota">…</span></div>';
    html += '<div class="parole-tray">';
    mescolate.forEach((p, i) => {
      html += '<button type="button" class="tok" data-tok="' + i + '">' + p + '</button>';
    });
    html += '</div>';
    html += '<button type="button" class="mini-annulla" data-annulla>Ricomincia</button>';
    body.innerHTML = html;
  }
  else if (fmt === 'errore') {
    /* "wrong" può essere una parola o un elenco: alcuni errori coinvolgono due
       parole (es. «gli lo» da fondere in «glielo», o l'ordine «lo me»), e in
       quei casi il clic su una qualsiasi delle due va accettato. */
    box.dataset.answer = Array.isArray(itemData.wrong) ? itemData.wrong.join('|') : itemData.wrong;
    box.dataset.fix = itemData.fix;
    // spezza la frase in parole cliccabili
    const words = itemData.q.split(' ');
    /* Alcune locuzioni sono un blocco unico anche se contengono uno spazio:
       «ci sono» non si può correggere cliccando solo «sono», perché la forma
       giusta è «c'è» e non «ci è». Il clic su una qualunque delle parole
       seleziona l'intero blocco.

       Perché la lista contiene anche locuzioni sempre corrette: se unissi
       soltanto quelle sbagliate, il blocco sarebbe la risposta. Con questa
       lista un blocco unito è l'errore nel 10% dei casi, meno di una parola
       presa a caso — quindi non è un indizio. Chi la allunga controlli prima
       che la locuzione aggiunta non sia bersaglio in nessun item: «ci vuole»
       e «la settimana scorsa» sono state escluse per questo. */
    const gruppi = new Array(words.length).fill(null);
    LOCUZIONI.forEach(loc => {
      const parti = loc.split(' ');
      for (let i = 0; i <= words.length - parti.length; i++) {
        if (gruppi[i] !== null) continue;
        let combacia = true;
        for (let j = 0; j < parti.length; j++) {
          const p = words[i + j].replace(/[.,;:!?]$/, '').toLowerCase();
          if (p !== parti[j]) { combacia = false; break; }
        }
        if (!combacia) continue;
        const testo = parti.map((_, j) => words[i + j].replace(/[.,;:!?]$/, '')).join(' ');
        for (let j = 0; j < parti.length; j++) gruppi[i + j] = { id: i, testo: testo };
      }
    });
    /* Avviso volutamente neutro: l'istruzione vera sta in cima all'esercizio ed
       è specifica («clicca l'articolo sbagliato», «la frase è rivolta a un
       cliente…»). Questo si limita a ricordare cosa si deve fare quando gli item
       in colonna allontanano dall'istruzione, senza contraddirla e senza dire
       «parola», che con le locuzioni raggruppate non sarebbe sempre esatto. */
    let html = '<div class="hint">Clicca dove c\'è l\'errore:</div><div class="words">';
    words.forEach((w, i) => {
      const clean = w.replace(/[.,;:!?]$/, '');
      const punct = w.slice(clean.length);
      /* Il gruppo NON si vede finché non lo si clicca: nessuna cornice, nessuno
         spazio diverso. Altrimenti l'occhio lo troverebbe prima della lettura. */
      const g = gruppi[i] ? ' data-g="' + gruppi[i].id + '"' : '';
      const val = (gruppi[i] ? gruppi[i].testo : clean).replace(/"/g, '&quot;');
      html += '<span class="word" data-w="' + val + '"' + g + '>' + clean + '</span>' + punct + ' ';
    });
    html += '</div>';
    body.innerHTML = html;
  }
  else if (fmt === 'giusta') {
    /* Mescolamento come nel formato «buco»: vedi la nota lì sopra. */
    const mescolate = pickRandom(
      itemData.options.map((op, i) => ({ op, i })),
      itemData.options.length
    );
    box.dataset.answer = mescolate.findIndex(o => o.i === itemData.answer);
    let html = '<div class="item__text">' + itemData.q + '</div><div class="opts" style="flex-direction:column;align-items:stretch;">';
    mescolate.forEach((o, i) => {
      html += '<button type="button" class="opt" data-i="' + i + '" style="text-align:left;">' + o.op + '</button>';
    });
    html += '</div>';
    body.innerHTML = html;
  }

  box.appendChild(body);
  return box;
}

function renderAllPages(){
  const content = document.getElementById('content');
  let refCounter = 0;
  // numero totale di domande del test e intervallo coperto da ogni pagina
  const totDomande = selected.reduce((s, st) =>
    s + st.exercises.reduce((k, e) => k + e.items.length, 0), 0);
  rangeDomande = [];   // per pagina: {da, a}

  let nProg = 0;       // numerazione progressiva su tutto il test

  selected.forEach((struct, si) => {
    const page = document.createElement('div');
    page.className = 'pagewrap';
    page.dataset.page = si;
    page.dataset.lvl = struct.lvl;
    page.dataset.slvl = livelloStima(struct);

    const daQui = nProg + 1;

    const block = document.createElement('div');
    block.className = 'struct-block';
    /* Colore neutro durante il test: i colori di livello (verde A1, blu B1…)
       rivelerebbero a che livello sta rispondendo lo studente, vanificando la
       scelta di nascondere nomi ed etichette. I colori di livello restano nei
       risultati, dove sono informazione utile. */
    block.style.setProperty('--lvl', 'var(--neutro)');
    // Nessun nome di struttura né livello durante il test: sarebbero un indizio
    // (e nel piazzamento un'etichetta tipo "C1" scoraggia). I nomi compaiono
    // solo nei risultati finali, dove sono informazione utile.
    const eyebrow = document.createElement('p');
    eyebrow.className = 'struct-block__eyebrow';
    block.appendChild(eyebrow);

    struct.exercises.forEach(ex => {
      const exDiv = document.createElement('div');
      exDiv.className = 'exercise';
      exDiv.innerHTML = '<span class="exercise__type">' + ex.type + '</span><p class="exercise__instr">' + ex.instr + '</p>';
      // Esercizi di comprensione: il brano si stampa una volta sola, in cima,
      // e le domande sotto contengono soltanto la domanda.
      if (ex.testo) {
        const t = document.createElement('div');
        t.className = 'exercise__testo';
        t.innerHTML = ex.testo.split('\n').filter(Boolean).map(p => '<p>' + p.trim() + '</p>').join('');
        exDiv.appendChild(t);
      }
      /* Posizioni della risposta giusta distribuite sugli item di questo
         esercizio: una rotazione che parte da un punto casuale, così non
         capita che tre item su quattro abbiano la giusta sullo stesso
         bottone. Stesso PRNG: col seed resta riproducibile. */
      const nOpz = (ex.items[0] && ex.items[0].options) ? ex.items[0].options.length : 3;
      const partenza = Math.floor(rng() * nOpz);
      ex.items.forEach((itemData, idx) => {
        itemData._n = ++nProg;          // numero progressivo, non riparte da 1
        const refId = 'r' + (refCounter++);
        const itemBox = renderItem(itemData, ex.fmt, refId, (partenza + idx) % nOpz);
        itemBox.dataset.struct = struct.title;
        itemBox.dataset.lez = (struct.lez || []).join(', ');
        itemBox.dataset.lvl = struct.lvl;
        itemBox.dataset.slvl = livelloStima(struct);
        itemBox.dataset.type = ex.type;
        itemBox.dataset.instr = ex.instr || '';   // serve al riepilogo raggruppato
        // salva il testo "pulito" della domanda per il transcript
        itemBox.dataset.q = itemData.q;
        exDiv.appendChild(itemBox);
      });
      block.appendChild(exDiv);
    });

    rangeDomande[si] = { da: daQui, a: nProg, tot: totDomande };
    eyebrow.textContent = 'Domande ' + daQui + '-' + nProg + ' di ' + totDomande;

    page.appendChild(block);
    content.appendChild(page);
  });

  // gestione click su opzioni (buco/giusta) e parole (errore)
  content.addEventListener('click', e => {
    if (e.target.classList.contains('opt')) {
      const opts = e.target.parentElement.querySelectorAll('.opt');
      opts.forEach(o => o.classList.remove('sel'));
      e.target.classList.add('sel');
      const item = e.target.closest('.item');
      item.dataset.chosen = e.target.dataset.i;
      // se la frase ha uno spazio vuoto, inserisci lì la parola scelta
      const gap = item.querySelector('[data-gap]');
      if (gap) {
        gap.textContent = e.target.textContent;
        gap.classList.add('filled');
      }
    }
    // formato "ordina": clic sulla parola nel serbatoio → la aggiunge alla frase;
    // clic sulla parola nella frase → la rimanda nel serbatoio
    if (e.target.classList.contains('tok')) {
      const item = e.target.closest('.item');
      const comp = item.querySelector('[data-composta]');
      const vuota = comp.querySelector('.composta__vuota');
      if (vuota) vuota.remove();
      comp.appendChild(e.target);
      e.target.classList.add('tok--messa');
      aggiornaComposta(item);
      return;
    }
    if (e.target.dataset.annulla !== undefined) {
      e.preventDefault();
      const item = e.target.closest('.item');
      const tray = item.querySelector('.parole-tray');
      item.querySelectorAll('[data-composta] .tok').forEach(t => {
        t.classList.remove('tok--messa'); tray.appendChild(t);
      });
      aggiornaComposta(item);
      return;
    }
    if (e.target.classList.contains('word')) {
      const cont = e.target.parentElement;
      cont.querySelectorAll('.word').forEach(w => w.classList.remove('sel'));
      const g = e.target.dataset.g;
      if (g !== undefined) cont.querySelectorAll('.word[data-g="' + g + '"]').forEach(w => w.classList.add('sel'));
      else e.target.classList.add('sel');
      e.target.closest('.item').dataset.chosen = e.target.dataset.w;
    }
  });
}

/* Aggiorna lo stato di un item "ordina": salva la sequenza costruita e
   ripristina il segnaposto se la frase è vuota. */
function aggiornaComposta(item){
  const comp = item.querySelector('[data-composta]');
  const scelte = Array.from(comp.querySelectorAll('.tok')).map(t => t.textContent);
  if (scelte.length) item.dataset.chosen = JSON.stringify(scelte);
  else {
    delete item.dataset.chosen;
    if (!comp.querySelector('.composta__vuota')) {
      const v = document.createElement('span');
      v.className = 'composta__vuota'; v.textContent = '…';
      comp.appendChild(v);
    }
  }
}

function showPage(idx){
  document.querySelectorAll('.pagewrap').forEach(p => p.classList.remove('active'));
  document.querySelector('.pagewrap[data-page="' + idx + '"]').classList.add('active');
  currentPage = idx;
  pagineViste.add(idx);
  const r = rangeDomande[idx];
  document.getElementById('progFill').style.width = ((r.a / r.tot) * 100) + '%';
  document.getElementById('progLabel').textContent =
    (r.da === r.a)
      ? 'Domanda ' + r.da + ' di ' + r.tot
      : 'Domande ' + r.da + '-' + r.a + ' di ' + r.tot;
  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').textContent = (idx === totalPages - 1) ? 'Invia risultati' : 'Avanti →';
  window.scrollTo({top:0, behavior:'instant'});
}

/* Conta gli item senza risposta: nella pagina indicata, oppure in tutto il
   test se idx è null (usato al momento dell'invio).
   Avviso superabile: intercetta le domande saltate per distrazione, ma non
   costringe a indovinare — una casella vuota è informazione più onesta di
   una risposta tirata a caso. */
/* Un item è "risposto" in modo diverso secondo il formato: i buchi digitati
   non usano dataset.chosen ma il contenuto dei campi. */
function haRisposta(it){
  if (it.dataset.fmt === 'fill') {
    return Array.from(it.querySelectorAll('.blank')).some(i => i.value.trim() !== '');
  }
  return it.dataset.chosen !== undefined;
}
function senzaRisposta(idx){
  const scope = (idx === null)
    ? document
    : document.querySelector('.pagewrap[data-page="' + idx + '"]');
  return Array.from(scope.querySelectorAll('.item')).filter(it => !haRisposta(it)).length;
}

function confermaProsegui(ultima){
  // sull'ultima pagina guarda tutto il test: è l'ultima occasione per rimediare
  const n = ultima ? senzaRisposta(null) : senzaRisposta(currentPage);
  if (n === 0) return true;
  const quante = (n === 1) ? 'una domanda' : n + ' domande';
  return ultima
    ? confirm('Hai lasciato ' + quante + ' senza risposta in tutto il test.' +
              '\n\nPuoi tornare indietro con «Indietro» per completarle.' +
              '\n\nVuoi inviare comunque?')
    : confirm('Hai lasciato ' + quante + ' senza risposta in questa sezione.' +
              '\n\nVuoi continuare comunque?');
}

/* L'arresto ragiona sui livelli di STIMA, non sull'ordine delle pagine: una
   struttura può stare nell'elenco sotto B1 e contare come B2, quindi le pagine
   di un livello non sono necessariamente contigue. Un livello si considera
   concluso quando tutte le sue pagine sono state mostrate. */
function pagineDelLivello(slvl){
  return Array.from(document.querySelectorAll('.pagewrap'))
    .filter(p => p.dataset.slvl === slvl);
}
function livelloConcluso(slvl){
  return pagineDelLivello(slvl).every(p => pagineViste.has(parseInt(p.dataset.page)));
}
function contaLivello(slvl){
  let ok = 0, tot = 0;
  pagineDelLivello(slvl).forEach(p => {
    if (!pagineViste.has(parseInt(p.dataset.page))) return;
    p.querySelectorAll('.item').forEach(it => {
      tot++;
      if (checkItem(it).state === 'giusto') ok++;
    });
  });
  return { ok: ok, tot: tot, pct: tot ? (ok / tot) * 100 : 0 };
}
/* Restituisce il livello su cui fermarsi, se ce n'è uno: concluso, con
   abbastanza domande da essere attendibile, e sotto la soglia. */
function livelloDaArrestare(){
  const visti = new Set();
  document.querySelectorAll('.pagewrap').forEach(p => visti.add(p.dataset.slvl));
  for (const l of LVL_SEQ) {
    if (!visti.has(l)) continue;
    if (!livelloConcluso(l)) continue;
    const c = contaLivello(l);
    if (c.tot >= MIN_ITEM_LIVELLO && c.pct < SOGLIA_MINIMA) return l;
  }
  return null;
}

document.getElementById('prevBtn').addEventListener('click', () => { if (currentPage>0) showPage(currentPage-1); });
document.getElementById('nextBtn').addEventListener('click', () => {
  const ultima = (currentPage === totalPages - 1);
  if (!confermaProsegui(ultima)) return;
  if (ultima) { submitTest(); return; }

  // arresto anticipato: se un livello è concluso e sotto la soglia, i livelli
  // successivi darebbero solo zeri prevedibili
  if (adattivo) {
    const stop = livelloDaArrestare();
    if (stop) { arrestoAnticipato = stop; submitTest(); return; }
  }
  showPage(currentPage + 1);
});

/* ---------- correzione + invio ---------- */
function checkItem(it){
  const fmt = it.dataset.fmt;
  if (fmt === 'fill') {
    const inputs = it.querySelectorAll('.blank');
    const vals = Array.from(inputs).map(i => i.value.trim());
    const answer = vals.join(' / ') || '(vuoto)';
    if (vals.every(v => !v)) return { state:'vuoto', answer:'(vuoto)', key: it.dataset.answer };
    const forme = it.dataset.no ? JSON.parse(it.dataset.no) : [];
    const res = fillCorrect(vals.length > 1 ? vals.join(' / ') : vals[0], it.dataset.answer, forme);
    /* Se l'item elenca le forme errate note (campo "no"), l'autore sta dicendo che
       la risposta è obbligata: una risposta diversa è sbagliata, non "da verificare".
       Senza quell'elenco resta la prudenza di prima, perché potrebbero esserci
       formulazioni valide non previste. */
    const esitoErrato = forme.length ? 'sbagliato' : 'verifica';
    return { state: res === true ? 'giusto' : (res === null ? 'vuoto' : esitoErrato), answer, key: it.dataset.answer };
  }
  if (fmt === 'buco') {
    const chosen = it.dataset.chosen;
    const opts = it.querySelectorAll('.opt');
    if (chosen === undefined) return { state:'vuoto', answer:'(non risposto)', key: opts[it.dataset.answer]?.textContent };
    const correct = parseInt(chosen) === parseInt(it.dataset.answer);
    return { state: correct ? 'giusto':'sbagliato', answer: opts[parseInt(chosen)].textContent, key: opts[parseInt(it.dataset.answer)].textContent };
  }
  if (fmt === 'giusta') {
    const chosen = it.dataset.chosen;
    const opts = it.querySelectorAll('.opt');
    if (chosen === undefined) return { state:'vuoto', answer:'(non risposto)', key: opts[it.dataset.answer]?.textContent };
    const correct = parseInt(chosen) === parseInt(it.dataset.answer);
    return { state: correct ? 'giusto':'sbagliato', answer: opts[parseInt(chosen)].textContent, key: opts[parseInt(it.dataset.answer)].textContent };
  }
  if (fmt === 'ordina') {
    const sol = JSON.parse(it.dataset.answer);
    const alt = it.dataset.alt ? JSON.parse(it.dataset.alt) : [];
    const chiave = sol.join(' ');
    if (it.dataset.chosen === undefined) return { state:'vuoto', answer:'(non risposto)', key: chiave };
    const scelte = JSON.parse(it.dataset.chosen);
    const dato = scelte.join(' ');
    const conf = s => s.map(x => x.toLowerCase()).join(' ');
    const ok = conf(scelte) === conf(sol) || alt.some(a => conf(scelte) === conf(a));
    return { state: ok ? 'giusto' : 'sbagliato', answer: dato, key: chiave };
  }
  if (fmt === 'errore') {
    const chosen = it.dataset.chosen;
    if (chosen === undefined) return { state:'vuoto', answer:'(non risposto)',
      key: it.dataset.answer.split('|').join(' / ') + ' → ' + it.dataset.fix };
    const accettate = it.dataset.answer.split('|');
    const correct = accettate.some(a => normalizeText(chosen) === normalizeText(a));
    return { state: correct ? 'giusto':'sbagliato', answer: chosen,
             key: accettate.join(' / ') + ' → ' + it.dataset.fix };
  }
  return { state:'vuoto', answer:'?', key:'?' };
}

const STATE_LABEL = { giusto:'CORRETTO', sbagliato:'SBAGLIATO', verifica:'DA VERIFICARE', vuoto:'NON RISPOSTO' };

/* ---------- stima del livello (solo per test che coprono più livelli) ----------
   Soglia 70%: standard nei test di piazzamento. Tre fasce:
     >= 70%  → livello consolidato
     40-69%  → livello in corso (è qui che conviene iniziare a insegnare)
     < 40%   → livello non raggiunto
   Il livello stimato è l'ultimo consolidato; se il successivo è "in corso"
   viene segnalato come punto di partenza per le lezioni. */
const LVL_SEQ = ['a','a2','b1','b2','c1'];

/* Livello usato per la STIMA, che può differire da quello di raggruppamento.
   Alcune strutture si introducono presto ma si controllano tardi: il congiuntivo
   si insegna a B1 ma un B1 autentico non lo padroneggia. Se contassero come B1,
   il test sottostimerebbe sistematicamente. Con "stima" restano dove le cerchi
   nell'elenco, ma pesano sul livello giusto nel calcolo. */
function livelloStima(s){ return s.stima || s.lvl; }

/* Un livello con pochissime domande dà percentuali rumorose: con 3 item e tre
   opzioni, chi indovina può fare 33% o 67% per caso. Sotto questa soglia il
   livello non viene valutato. */
const MIN_ITEM_LIVELLO = 6;

/* Soglia inferiore al 50% e non al 40%: con tre opzioni chi tira a indovinare
   prende in media il 33%, e su pochi item può arrivare al 40-45% per fortuna.
   Il 50% sta ragionevolmente sopra il caso, mentre chi conosce il livello lo
   supera senza difficoltà. */
/* Le etichette sono le stesse del verdetto — «base» e non «in corso» — così
   la ripartizione per livello e la riga finale parlano la stessa lingua. */
function fasciaLivello(pct){
  if (pct >= 70) return 'solido';
  if (pct >= 50) return 'base';
  return 'non raggiunto';
}
const SOGLIA_MINIMA = 50;   // usata anche dall'arresto anticipato

/* ---------- stima del livello ----------
   La regola precedente scorreva i livelli dal basso e si fermava al primo che
   non arrivava al 70%. Funziona solo se il rendimento cala salendo di livello,
   ma non è sempre così: uno studente può fare 67% su A1 e 83% su A2 (distrazione
   sulle basi, o item A1 più insidiosi). In quel caso il verdetto «A1 base»
   ignorava che i livelli superiori erano andati meglio.

   Regola attuale:
     1. si cerca il CROLLO, cioè il primo livello sotto il 50%: da lì in su
        i risultati non si considerano, perché senza le fondamenta non regge
        nulla di superiore;
     2. fra i livelli prima del crollo, il verdetto è il PIÙ ALTO solido (>=70%);
     3. se nessuno è solido, si prende il più alto «in corso» (50-69%) → «X base»;
     4. se non c'è nemmeno quello, si nomina il livello precedente (A0).
   Se un livello INFERIORE a quello dichiarato non è solido, si segnala come
   lacuna: è informazione che serve per impostare le lezioni. */
const LVL_PRECEDENTE = { a:'A0', a2:'A1', b1:'A2', b2:'B1', c1:'B2' };

function stimaLivello(perLvl){
  /* Si valutano solo i livelli con almeno MIN_ITEM_LIVELLO domande: sotto quella
     soglia la percentuale è dominata dal caso e darebbe verdetti inventati. */
  const presenti = LVL_SEQ.filter(l => perLvl[l] && perLvl[l].tot >= MIN_ITEM_LIVELLO);
  if (!presenti.length) {
    return { presenti: [], ultimoSolido: null, bloccante: null, lacune: [],
             verdetto: 'domande insufficienti per stimare il livello' };
  }
  const pctDi = l => (perLvl[l].ok / perLvl[l].tot) * 100;

  // 1. il crollo: primo livello sotto il 50%
  const iCrollo = presenti.findIndex(l => pctDi(l) < 50);
  const validi = (iCrollo === -1) ? presenti : presenti.slice(0, iCrollo);
  const bloccante = (iCrollo === -1) ? null : presenti[iCrollo];

  // 2. il più alto solido fra quelli validi
  let ultimoSolido = null;
  validi.forEach(l => { if (fasciaLivello(pctDi(l)) === 'solido') ultimoSolido = l; });

  // 3. altrimenti il più alto «in corso»
  let piuAltoInCorso = null;
  validi.forEach(l => { if (fasciaLivello(pctDi(l)) === 'base') piuAltoInCorso = l; });

  // lacune: livelli non solidi sotto l'ultimo solido
  const lacune = [];
  if (ultimoSolido) {
    const fino = presenti.indexOf(ultimoSolido);
    for (let i = 0; i < fino; i++) {
      if (fasciaLivello(pctDi(presenti[i])) !== 'solido') lacune.push(presenti[i]);
    }
  }

  /* Se il livello subito sopra l'ultimo solido è «in corso», il verdetto sale
     a «<quello> base»: lo studente lo ha cominciato. Ma solo se sotto non ci
     sono lacune — non si dichiara avviato un livello alto a chi ha buchi nelle
     basi. */
  let verdetto;
  const iSolido = ultimoSolido ? presenti.indexOf(ultimoSolido) : -1;
  const successivo = presenti[iSolido + 1];
  const successivoInCorso = successivo && fasciaLivello(pctDi(successivo)) === 'base'
                            && validi.indexOf(successivo) !== -1;

  if (ultimoSolido && successivoInCorso && !lacune.length) {
    verdetto = LVL_TAG[successivo] + ' base';
  } else if (ultimoSolido) {
    verdetto = LVL_TAG[ultimoSolido] + ' solido';
  } else if (piuAltoInCorso) {
    verdetto = LVL_TAG[piuAltoInCorso] + ' base';
  } else {
    const piuBasso = presenti[0];
    const prec = LVL_PRECEDENTE[piuBasso];
    verdetto = (piuBasso === LVL_SEQ[0]) ? prec : prec + ' o inferiore';
  }
  /* Le lacune non si elencano per livello — il programma è a spirale e quelle
     strutture tornano comunque più avanti — ma si segnalano con una parola:
     «B1 con lacune» vuol dire B1 raggiunto, con qualche buco sotto. Il dettaglio
     di quali strutture sia resta nella ripartizione per struttura.
     Le tre etichette per livello sono quindi: base · con lacune · solido. */
  if (lacune.length && / solido$/.test(verdetto)) {
    verdetto = verdetto.replace(/ solido$/, ' con lacune');
  }

  return { presenti, ultimoSolido, bloccante, lacune, verdetto };
}

function submitTest(){
  /* Con l'arresto anticipato si contano solo le domande delle pagine mostrate:
     quelle mai viste non sono "sbagliate", semplicemente non sono state poste. */
  const items = Array.from(document.querySelectorAll('.item')).filter(it => {
    const p = it.closest('.pagewrap');
    return pagineViste.has(parseInt(p.dataset.page));
  });
  const nonPoste = document.querySelectorAll('.item').length - items.length;
  let ok=0, sbagliati=0, daVerif=0, nonRisp=0, tot=items.length;

  // raccogli per struttura, per livello, e la lista errori
  const perStruct = {};   // titolo → {ok, tot}
  const structOrder = [];
  const perLvl = {};      // livello → {ok, tot}
  const perEsercizio = {};    // chiave struttura+tipo → errori di quell'esercizio
  const ordineEsercizi = [];

  items.forEach(it => {
    const r = checkItem(it);
    const st = it.dataset.struct;
    const lv = it.dataset.slvl;
    if (!(st in perStruct)) { perStruct[st] = {ok:0, tot:0, lez: it.dataset.lez || ''}; structOrder.push(st); }
    perStruct[st].tot++;
    if (!(lv in perLvl)) perLvl[lv] = {ok:0, tot:0};
    perLvl[lv].tot++;

    if (r.state === 'giusto') { ok++; perStruct[st].ok++; perLvl[lv].ok++; }
    else {
      if (r.state === 'sbagliato') sbagliati++;
      else if (r.state === 'verifica') daVerif++;
      else if (r.state === 'vuoto') nonRisp++;
      /* Gli errori si raggruppano per esercizio: la consegna compare una volta
         come intestazione invece di ripetersi su ogni riga, e si vede a colpo
         d'occhio se gli sbagli si concentrano in un esercizio solo. */
      const chiave = st + '||' + it.dataset.type;
      if (!perEsercizio[chiave]) {
        perEsercizio[chiave] = { struct: st, tipo: it.dataset.type,
                                 consegna: it.dataset.instr || '', righe: [] };
        ordineEsercizi.push(chiave);
      }
      perEsercizio[chiave].righe.push(
'   \u00b7 ' + it.dataset.q + '\n' +
'     Risposta: ' + r.answer + '  \u2014  Corretta: ' + (r.key || '') +
'  [' + STATE_LABEL[r.state] + ']');
    }
  });

  const score = ok + ' / ' + tot;

  /* ---------- voto in decimi ----------
     Una sola cifra decimale: «7,3» e non «7,25», che darebbe una falsa
     impressione di precisione. Il totale cambia da un test all'altro, il voto
     no: è quello che rende confrontabili due sessioni diverse. */
  const voto = tot ? (ok / tot * 10) : 0;
  /* Una sola cifra decimale, e solo quando serve: «7,3» ma «8» e «10»,
     non «8,0» e «10,0». */
  const votoTxt = (Math.round(voto * 10) % 10 === 0)
    ? String(Math.round(voto))
    : voto.toFixed(1).replace('.', ',');

  /* La soglia di sufficienza vale solo nei test di PROGRESSO: lì hai scelto tu
     le strutture e il 6 significa «ha imparato quello che abbiamo fatto».
     In un piazzamento non c'è nulla da superare — chi prende 4 non ha fallito,
     è semplicemente un principiante — quindi la soglia non compare. */
  const SOGLIA_VOTO = 6;
  const eProgresso = !adattivo;
  const superato = voto >= SOGLIA_VOTO;
  const dateStr = new Date().toLocaleDateString('it-IT');

  // ---- righe per struttura (usate sia per lo studente sia per l'email) ----
  const structRows = structOrder.map(st =>
    st + ': ' + perStruct[st].ok + '/' + perStruct[st].tot);

  /* ---- livelli: si dichiarano SOLO nel piazzamento ----
     Il verdetto di livello risponde alla domanda «da dove faccio partire questo
     studente»: ha senso quando il test è stato costruito per rispondere, cioè
     nel piazzamento, dove ogni livello riceve 12 domande e i livelli si
     escludono a vicenda salendo.

     In un test di progresso le strutture le sceglie l'insegnante, che il loro
     livello lo sa già: lì servono il voto, gli errori e dove sono caduti. Un
     «B1 solido» calcolato su tre strutture scelte a mano direbbe soltanto che
     quelle tre sono andate bene, ma lo direbbe con le parole di un piazzamento.

     Il criterio è dunque il TIPO di test, non quanti livelli tocca: un test di
     progresso su due livelli resta un test di progresso. */
  const stima = stimaLivello(perLvl);
  const livelliPresenti = LVL_SEQ.filter(l => perLvl[l]);
  const mostraLivelli = adattivo;

  let lvlRows = [], lvlVerdict = '';
  if (mostraLivelli) {
    lvlRows = LVL_SEQ.filter(l => perLvl[l]).map(l => {
      const p = perLvl[l];
      const pct = Math.round((p.ok / p.tot) * 100);
      return LVL_TAG[l] + ': ' + p.ok + '/' + p.tot + ' (' + pct + '%) — ' +
        (p.tot >= MIN_ITEM_LIVELLO ? fasciaLivello(pct) : 'domande insufficienti, non valutato');
    });
    lvlVerdict = stima.verdetto;
  }

  // ---- RIEPILOGO per l'insegnante ----
  const summary =
'RIEPILOGO TEST DI ITALIANO\n' +
'Studente: ' + studentName + '\n' +
'Data: ' + dateStr + '\n' +
'────────────────────────\n' +
(arrestoAnticipato
  ? 'Test chiuso in anticipo: il livello ' + LVL_TAG[arrestoAnticipato] +
    ' è sotto la soglia, i livelli successivi non sono stati proposti.\n' +
    '  (' + nonPoste + ' domande non poste, escluse dal punteggio)\n'
  : '') +
'VOTO: ' + votoTxt + ' / 10' +
  (eProgresso ? '   → ' + (superato ? 'SUPERATO' : 'NON SUPERATO') + ' (soglia ' + SOGLIA_VOTO + ')' : '') + '\n' +
'PUNTEGGIO: ' + score + '\n' +
'  Corretti: ' + ok + '  \u00b7  Sbagliati: ' + sbagliati +
  (daVerif ? '  \u00b7  Da verificare: ' + daVerif : '') +
  (nonRisp ? '  \u00b7  Non risposti: ' + nonRisp : '') + '\n' +
(daVerif ? '  (gli item "da verificare" sono a risposta aperta: controllali a mano)\n' : '') +
(mostraLivelli
  ? '────────────────────────\n' +
    'LIVELLO GRAMMATICALE STIMATO: ' + lvlVerdict + '\n' +
    '  (soglie: 70% = solido, 50-69% = base, sotto 50% = non raggiunto)\n' +
    '\n' +
    'PER LIVELLO:\n' + lvlRows.map(r => '  ' + r).join('\n') + '\n'
  : '') +
'────────────────────────\n' +
'PER STRUTTURA:\n' + structRows.map(r => '  ' + r).join('\n') + '\n' +
'────────────────────────\n' +
(ordineEsercizi.length
  ? 'ERRORI DA RIVEDERE:\n\n' + ordineEsercizi.map(function(k){
      const b = perEsercizio[k];
      return '\u2022 [' + b.struct + '] ' + b.tipo +
             (b.consegna ? '\n   Consegna: ' + b.consegna : '') + '\n' +
             b.righe.join('\n');
    }).join('\n\n')
  : 'Nessun errore: test completato tutto correttamente.');

  // ---- vista studente ----
  // Nel riquadro grande va il dato più significativo: il livello stimato se il
  // test copre più livelli, altrimenti il punteggio (su un test mono-livello
  // un'etichetta di livello non avrebbe senso).
  document.getElementById('testWrap').style.display = 'none';
  document.getElementById('doneWrap').style.display = 'block';
  document.getElementById('doneName').textContent = studentName;
  if (arrestoAnticipato) {
    document.getElementById('doneSub').textContent =
      'Il test si conclude qui: hai completato le sezioni adatte al tuo livello. Ecco il tuo risultato.';
  }

  /* Nel riquadro grande va il dato che conta per il tipo di test:
     - piazzamento: il livello, perché è il motivo per cui il test esiste
     - progresso: il voto in decimi, confrontabile fra due sessioni anche
       quando cambia il numero di domande. */
  const bannerNum = document.getElementById('bannerNum');
  const bannerTop = document.getElementById('bannerTop');
  if (mostraLivelli) {
    bannerTop.textContent = '';
    bannerNum.textContent = lvlVerdict;
    bannerNum.classList.add('num--testo');
    document.getElementById('bannerLbl').textContent = 'livello grammaticale stimato';
  } else {
    /* Il voto si legge su tre righe — «voto / 8,9 / decimi» — così la cifra
       grande resta la cifra e basta, e chi guarda capisce subito su quale
       scala sta. */
    bannerTop.textContent = 'voto';
    bannerNum.textContent = votoTxt;
    bannerNum.classList.remove('num--testo');
    document.getElementById('bannerLbl').textContent = 'decimi';
  }

  let html = '';

  /* Allo studente va solo il voto: 4,7 dice già tutto senza bisogno di
     aggiungere «non superata», che non informa e scoraggia. L'esito rispetto
     alla soglia serve all'insegnante e resta nel riepilogo via email. */

  if (mostraLivelli) {
    /* Anche dentro il piazzamento, la ripartizione per livello si mostra solo
       se i livelli con domande sono più d'uno: se il test si è fermato al primo
       per arresto anticipato, quella riga ripeterebbe il punteggio già scritto
       sopra (4/15 due volte) senza aggiungere nulla. Nel riepilogo
       all'insegnante resta sempre: lì è la prova del verdetto. */
    const conDomande = LVL_SEQ.filter(l => perLvl[l]);
    html +=
      '<div class="card"><p class="kicker">Risposte corrette</p>' +
      '<p style="font-family:var(--display);font-size:26px;margin:2px 0 ' +
      (conDomande.length > 1 ? '14px' : '2px') + ';">' + score + '</p>' +
      (conDomande.length > 1
        ? conDomande.map(l => {
            const p = perLvl[l];
            const pct = Math.round((p.ok / p.tot) * 100);
            return '<div class="summary-row"><span>domande di livello ' + LVL_TAG[l] + '</span><b>' + p.ok + '/' + p.tot + ' · ' + pct + '%</b></div>';
          }).join('')
        : '') +
      '</div>';
  }
  html +=
    '<div class="card"><p class="kicker">Come sei andato, struttura per struttura</p>' +
    structOrder.map(st => {
      const p = perStruct[st];
      return '<div class="summary-row"><span>' + st + '</span><b>' + p.ok + '/' + p.tot + '</b></div>';
    }).join('') +
    '</div>';
  document.getElementById('byStruct').innerHTML = html;

  sendResults(summary, score);
}

function sendResults(summary, score){
  const box = document.getElementById('fallbackBox');
  const useEmailJS = EMAILJS_CONFIG.SERVICE_ID && EMAILJS_CONFIG.TEMPLATE_ID && EMAILJS_CONFIG.PUBLIC_KEY;
  if (useEmailJS) {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js';
    script.onload = () => {
      emailjs.init(EMAILJS_CONFIG.PUBLIC_KEY);
      emailjs.send(EMAILJS_CONFIG.SERVICE_ID, EMAILJS_CONFIG.TEMPLATE_ID,
        { student_name: studentName, score: score, summary: summary })
        .then(() => { /* invio riuscito: lo studente non vede nulla in più */ })
        .catch(() => showFallback(box, summary));
    };
    script.onerror = () => showFallback(box, summary);
    document.head.appendChild(script);
  } else {
    showFallback(box, summary);
  }
}

// fallback: mostrato SOLO se l'invio automatico fallisce.
// Il riepilogo (con soluzioni) è nascosto in un campo che lo studente
// non deve leggere; serve solo per non perdere i dati in caso di guasto.
function showFallback(box, summary){
  const mailto = 'mailto:' + EMAILJS_CONFIG.TEACHER_EMAIL +
    '?subject=' + encodeURIComponent('Risultati test italiano - ' + studentName) +
    '&body=' + encodeURIComponent(summary);
  box.innerHTML =
    '<div class="card"><p class="note">Nota tecnica: l\'invio automatico non è andato a buon fine. ' +
    'Premi il pulsante per inviare il risultato all\'insegnante.</p>' +
    '<a class="btn" href="' + mailto + '" style="text-decoration:none;display:inline-block;">Invia all\'insegnante</a>' +
    '<textarea id="summaryOut" style="position:absolute;left:-9999px;">' + summary + '</textarea>' +
    '</div>';
}
</script>
