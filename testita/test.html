<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Test di italiano · Fabio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .pagewrap{display:none;}
  .pagewrap.active{display:block;}
  .navbar{
    position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
    padding:16px 0;display:flex;justify-content:space-between;align-items:center;margin-top:8px;
  }
  .navbar .spacer{flex:1;}

  /* scelta multipla a bottoni */
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .opt{
    font-family:var(--sans);font-size:14.5px;padding:8px 14px;border-radius:8px;
    border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;
  }
  .opt:hover{background:#eaf4f2;border-color:var(--lvl,var(--ink));color:var(--ink);}
  .opt.sel, .opt.sel:hover{background:var(--lvl,var(--ink));color:#fff;border-color:var(--lvl,var(--ink));}

  /* "individua l'errore": parole cliccabili */
  .words{margin-top:6px;line-height:2.1;}
  .word{
    display:inline;padding:3px 6px;border-radius:6px;cursor:pointer;
    border:1.5px solid transparent;
  }
  .word:hover{background:var(--line-soft);}
  .word.sel{background:var(--lvl,var(--ink));color:#fff;}
  .hint{font-size:12.5px;color:var(--ink-faint);margin-top:6px;font-style:italic;}

  /* spazio vuoto nella frase: vuoto = tratteggiato, riempito = parola evidenziata */
  .gap{
    display:inline-block;min-width:96px;text-align:center;
    color:var(--ink-faint);font-weight:600;letter-spacing:1px;
    border-bottom:2px solid var(--line);padding:0 6px;margin:0 3px;
    transition:background .15s, color .15s;
  }
  .gap.filled{
    color:var(--ink);background:transparent;font-weight:400;
    border-bottom-color:var(--lvl,var(--ink));
    letter-spacing:0;padding:0 6px;
  }
</style>

<body>

<div class="wrap" id="namegateWrap">
  <div class="namegate">
    <p class="kicker">Test di italiano</p>
    <h1>Come ti chiami?</h1>
    <input type="text" id="studentName" placeholder="Nome e cognome">
    <br>
    <button id="startBtn">Inizia il test</button>
  </div>
</div>

<div class="wrap" id="testWrap" style="display:none;">
  <div class="progress">
    <div class="progress__bar"><div class="progress__fill" id="progFill" style="width:0%;"></div></div>
    <div class="progress__label" id="progLabel"></div>
  </div>
  <div id="content"></div>
  <div class="navbar">
    <button class="ghost" id="prevBtn">← Indietro</button>
    <div class="spacer"></div>
    <button id="nextBtn">Avanti →</button>
  </div>
</div>

<div class="wrap" id="doneWrap" style="display:none;">
  <p class="kicker">Fatto</p>
  <h1>Grazie, <span id="doneName"></span>!</h1>
  <p class="sub" id="doneSub">Il tuo test è stato inviato all'insegnante. Ecco il tuo risultato.</p>
  <div class="score-banner">
    <div class="num" id="bannerNum">–</div>
    <div class="lbl" id="bannerLbl">risposte corrette</div>
  </div>
  <div id="byStruct"></div>
  <div id="fallbackBox"></div>
</div>

<script src="test-data.js"></script>
<script src="env.js"></script>
<script>
const LVL_COLOR = {a:"var(--c-a)", a2:"var(--c-a2)", b1:"var(--c-b1)", b2:"var(--c-b2)", c1:"var(--c-c1)"};
const LVL_TAG   = {a:"A1", a2:"A2", b1:"B1", b2:"B2", c1:"C1"};

const params = new URLSearchParams(location.search);
const nPick = parseInt(params.get('n') ?? '2');           // quanti item pescare per esercizio
/* adatt=1 → arresto anticipato: il test si chiude quando un livello scende sotto
   la soglia. Lo attiva solo il preset «Test di posizionamento»: in un test di
   progresso servono sempre tutte le domande, altrimenti i punteggi di due
   sessioni diverse non sono confrontabili. */
const adattivo = params.get('adatt') === '1';
const seedParam = params.get('seed');                      // opzionale: fissa la pesca

// strutture selezionate (nuovo formato s=0,3,7 ; retrocompat from/to)
let indices;
if (params.get('s')) {
  indices = params.get('s').split(',').map(x => parseInt(x)).filter(x => !isNaN(x));
} else {
  const from = parseInt(params.get('from') ?? '0');
  const to = parseInt(params.get('to') ?? (TEST_STRUCTURES.length - 1));
  indices = [];
  for (let i = from; i <= to; i++) indices.push(i);
}

/* ---------- PRNG con seed (così un link può essere riproducibile se serve) ---------- */
function makeRng(seed){
  let s = seed >>> 0;
  return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
const rng = makeRng(seedParam ? parseInt(seedParam) : (Date.now() & 0xffffffff));
function pickRandom(arr, k){
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, Math.min(k, copy.length));
}

/* ---------- anti-collisione tra esercizi ----------
   I tre esercizi di una struttura sono costruiti su frasi affini: se il
   sorteggio pesca la stessa frase in due esercizi diversi, uno rivela la
   risposta dell'altro (es. il buco "Se ___ di più..." e, tra le opzioni
   della Trasformazione, la stessa frase già completata).
   Qui si confrontano le frasi degli item e si scartano quelle troppo simili
   a una già scelta nella stessa struttura. Con 10 item in banca e 2-3 da
   pescare c'è sempre margine; se proprio non bastasse si ripiega sugli
   scarti, così il test non resta mai incompleto. */
const SOGLIA_SOMIGLIANZA = 0.6;

function paroleDi(txt){
  return txt.toLowerCase()
    .replace(/___+/g, ' ').replace(/→/g, ' ')
    .replace(/\([^)]*\)/g, ' ')
    .replace(/[.,;:!?«»'’"]/g, ' ')
    .split(/\s+/).filter(Boolean);
}
function frasiDi(item){
  const f = [item.q];
  if (item.options) item.options.forEach(o => { if (paroleDi(o).length >= 3) f.push(o); });
  return f.map(t => new Set(paroleDi(t)));
}
function jaccard(a, b){
  let inter = 0;
  a.forEach(w => { if (b.has(w)) inter++; });
  return inter / (a.size + b.size - inter);
}
// quanto un item somiglia al più simile di quelli già scelti (0 = nessuna affinità)
function somiglianzaMax(cand, giaScelti){
  const fc = frasiDi(cand);
  let max = 0;
  for (const altro of giaScelti) {
    for (const y of frasiDi(altro)) {
      for (const x of fc) {
        const s = jaccard(x, y);
        if (s > max) max = s;
      }
    }
  }
  return max;
}
function pescaSenzaCollisioni(pool, k, giaScelti){
  const mescolato = pickRandom(pool, pool.length);   // stesso PRNG: resta riproducibile col seed
  const scelti = [];
  for (let n = 0; n < k && mescolato.length; n++) {
    let idxMigliore = 0, peggiore = Infinity;
    for (let i = 0; i < mescolato.length; i++) {
      const s = somiglianzaMax(mescolato[i], giaScelti.concat(scelti));
      if (s < peggiore) { peggiore = s; idxMigliore = i; }
      if (peggiore === 0) break;      // nessuna affinità: non si può fare meglio
    }
    scelti.push(mescolato.splice(idxMigliore, 1)[0]);
  }
  return scelti;
}

/* costruisce il test pescando nPick item a caso da ogni esercizio */
const selected = indices.map(i => TEST_STRUCTURES[i]).filter(Boolean).map(s => {
  const usati = [];   // item già scelti in questa struttura, per evitare doppioni
  const exercises = s.exercises.map(e => {
    const items = pescaSenzaCollisioni(e.items, nPick, usati);
    usati.push(...items);
    return { type: e.type, fmt: e.fmt || 'fill', instr: e.instr, items: items };
  });
  // NB: va copiata anche stima, altrimenti il livello di calcolo si perde
  return { lvl: s.lvl, stima: s.stima, title: s.title, exercises: exercises };
});

let studentName = '';
let currentPage = 0;
let rangeDomande = [];   // per ogni pagina: {da, a, tot} — numerazione progressiva
let pagineViste = new Set();   // pagine effettivamente mostrate (per l'arresto anticipato)
let arrestoAnticipato = null;  // livello su cui il test si è fermato
const totalPages = selected.length;

/* ---------- normalizzazione per correzione fill ---------- */
function normalizeText(str){
  return str.toLowerCase()
    .replace(/\([^)]*\)/g, '')
    .replace(/[.,;:!?"'’]/g, '')
    .replace(/\s+/g, ' ').trim();
}
function fillCorrect(userVal, ans){
  // ans può avere alternative con "|" e/o buchi multipli con "/"
  if (!userVal || !userVal.trim()) return null; // null = non risposto
  const parts = ans.split('/').map(p => p.trim());          // buchi multipli
  const userParts = userVal.split('/').map(p => p.trim());
  if (parts.length > 1) {
    if (userParts.length !== parts.length) return false;
    return parts.every((p, i) => {
      const alts = p.split('|').map(a => normalizeText(a));
      return alts.includes(normalizeText(userParts[i]));
    });
  }
  const alts = ans.split('|').map(a => normalizeText(a));
  return alts.includes(normalizeText(userVal));
}

/* ---------- avvio ---------- */
document.getElementById('startBtn').addEventListener('click', () => {
  const val = document.getElementById('studentName').value.trim();
  if (!val) { document.getElementById('studentName').focus(); return; }
  studentName = val;
  document.getElementById('namegateWrap').style.display = 'none';
  document.getElementById('testWrap').style.display = 'block';
  renderAllPages();
  showPage(0);
});

/* ---------- rendering per formato ---------- */
function renderItem(itemData, fmt, refId){
  const box = document.createElement('div');
  box.className = 'item';
  box.dataset.fmt = fmt;
  box.dataset.ref = refId;

  const num = document.createElement('span');
  num.className = 'item__num';
  num.textContent = itemData._n;
  box.appendChild(num);

  const body = document.createElement('div');
  body.className = 'item__body';

  if (fmt === 'fill') {
    box.dataset.answer = itemData.a;
    const parts = itemData.q.split('___');
    let html = '<div class="item__text">';
    if (parts.length > 1) {
      html += parts.map((p, i) => p + (i < parts.length - 1 ? '<input class="blank" type="text">' : '')).join('');
    } else {
      html += itemData.q + '<br><input class="blank" type="text" style="width:100%;max-width:340px;">';
    }
    html += '</div>';
    body.innerHTML = html;
  }
  else if (fmt === 'buco') {
    box.dataset.answer = itemData.answer;
    const parts = itemData.q.split('___');
    let html = '<div class="item__text">' + parts.join('<span class="gap" data-gap>_____</span>') + '</div>';
    html += '<div class="opts">';
    itemData.options.forEach((op, i) => {
      html += '<button type="button" class="opt" data-i="' + i + '">' + op + '</button>';
    });
    html += '</div>';
    body.innerHTML = html;
  }
  else if (fmt === 'errore') {
    box.dataset.answer = itemData.wrong;
    box.dataset.fix = itemData.fix;
    // spezza la frase in parole cliccabili
    const words = itemData.q.split(' ');
    let html = '<div class="hint">Clicca la parola sbagliata:</div><div class="words">';
    words.forEach((w) => {
      const clean = w.replace(/[.,;:!?]$/, '');
      const punct = w.slice(clean.length);
      html += '<span class="word" data-w="' + clean.replace(/"/g,'&quot;') + '">' + clean + '</span>' + punct + ' ';
    });
    html += '</div>';
    body.innerHTML = html;
  }
  else if (fmt === 'giusta') {
    box.dataset.answer = itemData.answer;
    let html = '<div class="item__text">' + itemData.q + '</div><div class="opts" style="flex-direction:column;align-items:stretch;">';
    itemData.options.forEach((op, i) => {
      html += '<button type="button" class="opt" data-i="' + i + '" style="text-align:left;">' + op + '</button>';
    });
    html += '</div>';
    body.innerHTML = html;
  }

  box.appendChild(body);
  return box;
}

function renderAllPages(){
  const content = document.getElementById('content');
  let refCounter = 0;
  // numero totale di domande del test e intervallo coperto da ogni pagina
  const totDomande = selected.reduce((s, st) =>
    s + st.exercises.reduce((k, e) => k + e.items.length, 0), 0);
  rangeDomande = [];   // per pagina: {da, a}

  let nProg = 0;       // numerazione progressiva su tutto il test

  selected.forEach((struct, si) => {
    const page = document.createElement('div');
    page.className = 'pagewrap';
    page.dataset.page = si;
    page.dataset.lvl = struct.lvl;
    page.dataset.slvl = livelloStima(struct);

    const daQui = nProg + 1;

    const block = document.createElement('div');
    block.className = 'struct-block';
    block.style.setProperty('--lvl', LVL_COLOR[struct.lvl]);
    // Nessun nome di struttura né livello durante il test: sarebbero un indizio
    // (e nel piazzamento un'etichetta tipo "C1" scoraggia). I nomi compaiono
    // solo nei risultati finali, dove sono informazione utile.
    const eyebrow = document.createElement('p');
    eyebrow.className = 'struct-block__eyebrow';
    block.appendChild(eyebrow);

    struct.exercises.forEach(ex => {
      const exDiv = document.createElement('div');
      exDiv.className = 'exercise';
      exDiv.innerHTML = '<span class="exercise__type">' + ex.type + '</span><p class="exercise__instr">' + ex.instr + '</p>';
      ex.items.forEach(itemData => {
        itemData._n = ++nProg;          // numero progressivo, non riparte da 1
        const refId = 'r' + (refCounter++);
        const itemBox = renderItem(itemData, ex.fmt, refId);
        itemBox.dataset.struct = struct.title;
        itemBox.dataset.lvl = struct.lvl;
        itemBox.dataset.slvl = livelloStima(struct);
        itemBox.dataset.type = ex.type;
        // salva il testo "pulito" della domanda per il transcript
        itemBox.dataset.q = itemData.q;
        exDiv.appendChild(itemBox);
      });
      block.appendChild(exDiv);
    });

    rangeDomande[si] = { da: daQui, a: nProg, tot: totDomande };
    eyebrow.textContent = 'Domande ' + daQui + '-' + nProg + ' di ' + totDomande;

    page.appendChild(block);
    content.appendChild(page);
  });

  // gestione click su opzioni (buco/giusta) e parole (errore)
  content.addEventListener('click', e => {
    if (e.target.classList.contains('opt')) {
      const opts = e.target.parentElement.querySelectorAll('.opt');
      opts.forEach(o => o.classList.remove('sel'));
      e.target.classList.add('sel');
      const item = e.target.closest('.item');
      item.dataset.chosen = e.target.dataset.i;
      // se la frase ha uno spazio vuoto, inserisci lì la parola scelta
      const gap = item.querySelector('[data-gap]');
      if (gap) {
        gap.textContent = e.target.textContent;
        gap.classList.add('filled');
      }
    }
    if (e.target.classList.contains('word')) {
      const words = e.target.parentElement.querySelectorAll('.word');
      words.forEach(w => w.classList.remove('sel'));
      e.target.classList.add('sel');
      e.target.closest('.item').dataset.chosen = e.target.dataset.w;
    }
  });
}

function showPage(idx){
  document.querySelectorAll('.pagewrap').forEach(p => p.classList.remove('active'));
  document.querySelector('.pagewrap[data-page="' + idx + '"]').classList.add('active');
  currentPage = idx;
  pagineViste.add(idx);
  const r = rangeDomande[idx];
  document.getElementById('progFill').style.width = ((r.a / r.tot) * 100) + '%';
  document.getElementById('progLabel').textContent =
    (r.da === r.a)
      ? 'Domanda ' + r.da + ' di ' + r.tot
      : 'Domande ' + r.da + '-' + r.a + ' di ' + r.tot;
  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').textContent = (idx === totalPages - 1) ? 'Invia risultati' : 'Avanti →';
  window.scrollTo({top:0, behavior:'instant'});
}

/* Conta gli item senza risposta: nella pagina indicata, oppure in tutto il
   test se idx è null (usato al momento dell'invio).
   Avviso superabile: intercetta le domande saltate per distrazione, ma non
   costringe a indovinare — una casella vuota è informazione più onesta di
   una risposta tirata a caso. */
function senzaRisposta(idx){
  const scope = (idx === null)
    ? document
    : document.querySelector('.pagewrap[data-page="' + idx + '"]');
  return Array.from(scope.querySelectorAll('.item'))
    .filter(it => it.dataset.chosen === undefined).length;
}

function confermaProsegui(ultima){
  // sull'ultima pagina guarda tutto il test: è l'ultima occasione per rimediare
  const n = ultima ? senzaRisposta(null) : senzaRisposta(currentPage);
  if (n === 0) return true;
  const quante = (n === 1) ? 'una domanda' : n + ' domande';
  return ultima
    ? confirm('Hai lasciato ' + quante + ' senza risposta in tutto il test.' +
              '\n\nPuoi tornare indietro con «Indietro» per completarle.' +
              '\n\nVuoi inviare comunque?')
    : confirm('Hai lasciato ' + quante + ' senza risposta in questa sezione.' +
              '\n\nVuoi continuare comunque?');
}

/* L'arresto ragiona sui livelli di STIMA, non sull'ordine delle pagine: una
   struttura può stare nell'elenco sotto B1 e contare come B2, quindi le pagine
   di un livello non sono necessariamente contigue. Un livello si considera
   concluso quando tutte le sue pagine sono state mostrate. */
function pagineDelLivello(slvl){
  return Array.from(document.querySelectorAll('.pagewrap'))
    .filter(p => p.dataset.slvl === slvl);
}
function livelloConcluso(slvl){
  return pagineDelLivello(slvl).every(p => pagineViste.has(parseInt(p.dataset.page)));
}
function contaLivello(slvl){
  let ok = 0, tot = 0;
  pagineDelLivello(slvl).forEach(p => {
    if (!pagineViste.has(parseInt(p.dataset.page))) return;
    p.querySelectorAll('.item').forEach(it => {
      tot++;
      if (checkItem(it).state === 'giusto') ok++;
    });
  });
  return { ok: ok, tot: tot, pct: tot ? (ok / tot) * 100 : 0 };
}
/* Restituisce il livello su cui fermarsi, se ce n'è uno: concluso, con
   abbastanza domande da essere attendibile, e sotto la soglia. */
function livelloDaArrestare(){
  const visti = new Set();
  document.querySelectorAll('.pagewrap').forEach(p => visti.add(p.dataset.slvl));
  for (const l of LVL_SEQ) {
    if (!visti.has(l)) continue;
    if (!livelloConcluso(l)) continue;
    const c = contaLivello(l);
    if (c.tot >= MIN_ITEM_LIVELLO && c.pct < SOGLIA_MINIMA) return l;
  }
  return null;
}

document.getElementById('prevBtn').addEventListener('click', () => { if (currentPage>0) showPage(currentPage-1); });
document.getElementById('nextBtn').addEventListener('click', () => {
  const ultima = (currentPage === totalPages - 1);
  if (!confermaProsegui(ultima)) return;
  if (ultima) { submitTest(); return; }

  // arresto anticipato: se un livello è concluso e sotto la soglia, i livelli
  // successivi darebbero solo zeri prevedibili
  if (adattivo) {
    const stop = livelloDaArrestare();
    if (stop) { arrestoAnticipato = stop; submitTest(); return; }
  }
  showPage(currentPage + 1);
});

/* ---------- correzione + invio ---------- */
function checkItem(it){
  const fmt = it.dataset.fmt;
  if (fmt === 'fill') {
    const inputs = it.querySelectorAll('.blank');
    const vals = Array.from(inputs).map(i => i.value.trim());
    const answer = vals.join(' / ') || '(vuoto)';
    if (vals.every(v => !v)) return { state:'vuoto', answer:'(vuoto)', key: it.dataset.answer };
    const res = fillCorrect(vals.length > 1 ? vals.join(' / ') : vals[0], it.dataset.answer);
    return { state: res === true ? 'giusto' : (res === null ? 'vuoto' : 'verifica'), answer, key: it.dataset.answer };
  }
  if (fmt === 'buco') {
    const chosen = it.dataset.chosen;
    const opts = it.querySelectorAll('.opt');
    if (chosen === undefined) return { state:'vuoto', answer:'(non risposto)', key: opts[it.dataset.answer]?.textContent };
    const correct = parseInt(chosen) === parseInt(it.dataset.answer);
    return { state: correct ? 'giusto':'sbagliato', answer: opts[parseInt(chosen)].textContent, key: opts[parseInt(it.dataset.answer)].textContent };
  }
  if (fmt === 'giusta') {
    const chosen = it.dataset.chosen;
    const opts = it.querySelectorAll('.opt');
    if (chosen === undefined) return { state:'vuoto', answer:'(non risposto)', key: opts[it.dataset.answer]?.textContent };
    const correct = parseInt(chosen) === parseInt(it.dataset.answer);
    return { state: correct ? 'giusto':'sbagliato', answer: opts[parseInt(chosen)].textContent, key: opts[parseInt(it.dataset.answer)].textContent };
  }
  if (fmt === 'errore') {
    const chosen = it.dataset.chosen;
    if (chosen === undefined) return { state:'vuoto', answer:'(non risposto)', key: it.dataset.answer + ' → ' + it.dataset.fix };
    const correct = normalizeText(chosen) === normalizeText(it.dataset.answer);
    return { state: correct ? 'giusto':'sbagliato', answer: chosen, key: it.dataset.answer + ' → ' + it.dataset.fix };
  }
  return { state:'vuoto', answer:'?', key:'?' };
}

const STATE_LABEL = { giusto:'CORRETTO', sbagliato:'SBAGLIATO', verifica:'DA VERIFICARE', vuoto:'NON RISPOSTO' };

/* ---------- stima del livello (solo per test che coprono più livelli) ----------
   Soglia 70%: standard nei test di piazzamento. Tre fasce:
     >= 70%  → livello consolidato
     40-69%  → livello in corso (è qui che conviene iniziare a insegnare)
     < 40%   → livello non raggiunto
   Il livello stimato è l'ultimo consolidato; se il successivo è "in corso"
   viene segnalato come punto di partenza per le lezioni. */
const LVL_SEQ = ['a','a2','b1','b2','c1'];

/* Livello usato per la STIMA, che può differire da quello di raggruppamento.
   Alcune strutture si introducono presto ma si controllano tardi: il congiuntivo
   si insegna a B1 ma un B1 autentico non lo padroneggia. Se contassero come B1,
   il test sottostimerebbe sistematicamente. Con "stima" restano dove le cerchi
   nell'elenco, ma pesano sul livello giusto nel calcolo. */
function livelloStima(s){ return s.stima || s.lvl; }

/* Un livello con pochissime domande dà percentuali rumorose: con 3 item e tre
   opzioni, chi indovina può fare 33% o 67% per caso. Sotto questa soglia il
   livello non viene valutato. */
const MIN_ITEM_LIVELLO = 6;

/* Soglia inferiore al 50% e non al 40%: con tre opzioni chi tira a indovinare
   prende in media il 33%, e su pochi item può arrivare al 40-45% per fortuna.
   Il 50% sta ragionevolmente sopra il caso, mentre chi conosce il livello lo
   supera senza difficoltà. */
function fasciaLivello(pct){
  if (pct >= 70) return 'solido';
  if (pct >= 50) return 'in corso';
  return 'non raggiunto';
}
const SOGLIA_MINIMA = 50;   // usata anche dall'arresto anticipato

/* Il livello dichiarato è l'ultimo SOLIDO (>=70%).
   Si scorrono i livelli in ordine e ci si ferma al primo non solido:
     - se quel livello è "in corso" (50-69%)  →  "<livello> base"
     - se è "non raggiunto" (<50%)            →  "<ultimo solido> solido"
   Se nemmeno il livello più basso del test è raggiunto si nomina il livello
   precedente: sotto A1 c'è A0, quindi il verdetto è "A0". Se però il test
   parte da un livello alto (es. solo B1 in su), i livelli sotto non sono
   stati verificati: in quel caso si scrive "A2 o inferiore", che è onesto.
   Esempio: A2 solido + B1 al 50%  →  "B1 base"
            A2 solido + B1 al 20%  →  "A2 solido"
            A1 al 20% (test da A1) →  "A0"                            */
const LVL_PRECEDENTE = { a:'A0', a2:'A1', b1:'A2', b2:'B1', c1:'B2' };

function stimaLivello(perLvl){
  /* Si valutano solo i livelli con almeno MIN_ITEM_LIVELLO domande: sotto quella
     soglia la percentuale è dominata dal caso e darebbe verdetti inventati.
     I livelli scartati restano visibili nel riepilogo, marcati come non valutati. */
  const presenti = LVL_SEQ.filter(l => perLvl[l] && perLvl[l].tot >= MIN_ITEM_LIVELLO);
  if (!presenti.length) {
    return { presenti: [], ultimoSolido: null, bloccante: null,
             verdetto: 'domande insufficienti per stimare il livello' };
  }
  const pctDi = l => (perLvl[l].ok / perLvl[l].tot) * 100;

  let ultimoSolido = null, bloccante = null;
  for (const l of presenti) {
    if (fasciaLivello(pctDi(l)) === 'solido') ultimoSolido = l;
    else { bloccante = l; break; }   // primo livello non solido: ci si ferma qui
  }

  let verdetto;
  if (bloccante && fasciaLivello(pctDi(bloccante)) === 'in corso') {
    verdetto = LVL_TAG[bloccante] + ' base';
  } else if (ultimoSolido) {
    verdetto = LVL_TAG[ultimoSolido] + ' solido';
  } else {
    // nessun livello raggiunto: si nomina quello precedente al più basso testato
    const piuBasso = presenti[0];
    const prec = LVL_PRECEDENTE[piuBasso];
    // se il test parte dal livello più basso in assoluto, il precedente è certo (A0);
    // altrimenti i livelli inferiori non sono stati verificati
    verdetto = (piuBasso === LVL_SEQ[0]) ? prec : prec + ' o inferiore';
  }

  return { presenti, ultimoSolido, bloccante, verdetto };
}

function submitTest(){
  /* Con l'arresto anticipato si contano solo le domande delle pagine mostrate:
     quelle mai viste non sono "sbagliate", semplicemente non sono state poste. */
  const items = Array.from(document.querySelectorAll('.item')).filter(it => {
    const p = it.closest('.pagewrap');
    return pagineViste.has(parseInt(p.dataset.page));
  });
  const nonPoste = document.querySelectorAll('.item').length - items.length;
  let ok=0, sbagliati=0, daVerif=0, nonRisp=0, tot=items.length;

  // raccogli per struttura, per livello, e la lista errori
  const perStruct = {};   // titolo → {ok, tot}
  const structOrder = [];
  const perLvl = {};      // livello → {ok, tot}
  const errorLines = [];

  items.forEach(it => {
    const r = checkItem(it);
    const st = it.dataset.struct;
    const lv = it.dataset.slvl;
    if (!(st in perStruct)) { perStruct[st] = {ok:0, tot:0}; structOrder.push(st); }
    perStruct[st].tot++;
    if (!(lv in perLvl)) perLvl[lv] = {ok:0, tot:0};
    perLvl[lv].tot++;

    if (r.state === 'giusto') { ok++; perStruct[st].ok++; perLvl[lv].ok++; }
    else {
      if (r.state === 'sbagliato') sbagliati++;
      else if (r.state === 'verifica') daVerif++;
      else if (r.state === 'vuoto') nonRisp++;
      // dettaglio solo per gli errori (non i corretti)
      errorLines.push(
'• [' + st + '] ' + it.dataset.type + ' — ' + STATE_LABEL[r.state] + '\n' +
'   Domanda: ' + it.dataset.q + '\n' +
'   Risposta: ' + r.answer + '\n' +
'   Corretta: ' + (r.key || ''));
    }
  });

  const score = ok + ' / ' + tot;
  const dateStr = new Date().toLocaleDateString('it-IT');

  // ---- righe per struttura (usate sia per lo studente sia per l'email) ----
  const structRows = structOrder.map(st =>
    st + ': ' + perStruct[st].ok + '/' + perStruct[st].tot);

  // ---- livelli: la stima ha senso solo se il test copre più di un livello ----
  const stima = stimaLivello(perLvl);
  /* Di norma la stima ha senso solo se il test copre più livelli. Ma se il test
     si è fermato per arresto anticipato, il livello va sempre dichiarato: il
     fatto stesso di essersi fermato lì è il risultato. */
  const livelliPresenti = LVL_SEQ.filter(l => perLvl[l]);
  const multiLivello = livelliPresenti.length > 1 || !!arrestoAnticipato;

  let lvlRows = [], lvlVerdict = '';
  if (multiLivello) {
    lvlRows = LVL_SEQ.filter(l => perLvl[l]).map(l => {
      const p = perLvl[l];
      const pct = Math.round((p.ok / p.tot) * 100);
      return LVL_TAG[l] + ': ' + p.ok + '/' + p.tot + ' (' + pct + '%) — ' +
        (p.tot >= MIN_ITEM_LIVELLO ? fasciaLivello(pct) : 'domande insufficienti, non valutato');
    });
    lvlVerdict = stima.verdetto;
  }

  // ---- RIEPILOGO per l'insegnante ----
  const summary =
'RIEPILOGO TEST DI ITALIANO\n' +
'Studente: ' + studentName + '\n' +
'Data: ' + dateStr + '\n' +
'────────────────────────\n' +
(arrestoAnticipato
  ? 'Test chiuso in anticipo: il livello ' + LVL_TAG[arrestoAnticipato] +
    ' è sotto la soglia, i livelli successivi non sono stati proposti.\n' +
    '  (' + nonPoste + ' domande non poste, escluse dal punteggio)\n'
  : '') +
'PUNTEGGIO: ' + score + '\n' +
'  Corretti: ' + ok + '  ·  Sbagliati: ' + sbagliati +
'  ·  Da verificare: ' + daVerif + '  ·  Non risposti: ' + nonRisp + '\n' +
(daVerif ? '  (gli item "da verificare" sono a risposta aperta: controllali a mano)\n' : '') +
(multiLivello
  ? '────────────────────────\n' +
    'LIVELLO GRAMMATICALE STIMATO: ' + lvlVerdict + '\n' +
    '  (soglie: 70% = solido, 50-69% = in corso, sotto 50% = non raggiunto)\n' +
    'PER LIVELLO:\n' + lvlRows.map(r => '  ' + r).join('\n') + '\n'
  : '') +
'────────────────────────\n' +
'PER STRUTTURA:\n' + structRows.map(r => '  ' + r).join('\n') + '\n' +
'────────────────────────\n' +
(errorLines.length
  ? 'ERRORI DA RIVEDERE:\n\n' + errorLines.join('\n\n')
  : 'Nessun errore: test completato tutto correttamente.');

  // ---- vista studente ----
  // Nel riquadro grande va il dato più significativo: il livello stimato se il
  // test copre più livelli, altrimenti il punteggio (su un test mono-livello
  // un'etichetta di livello non avrebbe senso).
  document.getElementById('testWrap').style.display = 'none';
  document.getElementById('doneWrap').style.display = 'block';
  document.getElementById('doneName').textContent = studentName;
  if (arrestoAnticipato) {
    document.getElementById('doneSub').textContent =
      'Il test si conclude qui: hai completato le sezioni adatte al tuo livello. Ecco il tuo risultato.';
  }

  const bannerNum = document.getElementById('bannerNum');
  if (multiLivello) {
    bannerNum.textContent = lvlVerdict;
    bannerNum.classList.add('num--testo');
    document.getElementById('bannerLbl').textContent = 'livello grammaticale stimato';
  } else {
    bannerNum.textContent = score;
    bannerNum.classList.remove('num--testo');
    document.getElementById('bannerLbl').textContent = 'risposte corrette';
  }

  let html = '';
  if (multiLivello) {
    html +=
      '<div class="card"><p class="kicker">Risposte corrette</p>' +
      '<p style="font-family:var(--display);font-size:26px;margin:2px 0 14px;">' + score + '</p>' +
      LVL_SEQ.filter(l => perLvl[l]).map(l => {
        const p = perLvl[l];
        const pct = Math.round((p.ok / p.tot) * 100);
        return '<div class="summary-row"><span>' + LVL_TAG[l] + '</span><b>' + p.ok + '/' + p.tot + ' · ' + pct + '%</b></div>';
      }).join('') +
      '</div>';
  }
  html +=
    '<div class="card"><p class="kicker">Come sei andato, struttura per struttura</p>' +
    structOrder.map(st => {
      const p = perStruct[st];
      return '<div class="summary-row"><span>' + st + '</span><b>' + p.ok + '/' + p.tot + '</b></div>';
    }).join('') +
    '</div>';
  document.getElementById('byStruct').innerHTML = html;

  sendResults(summary, score);
}

function sendResults(summary, score){
  const box = document.getElementById('fallbackBox');
  const useEmailJS = EMAILJS_CONFIG.SERVICE_ID && EMAILJS_CONFIG.TEMPLATE_ID && EMAILJS_CONFIG.PUBLIC_KEY;
  if (useEmailJS) {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js';
    script.onload = () => {
      emailjs.init(EMAILJS_CONFIG.PUBLIC_KEY);
      emailjs.send(EMAILJS_CONFIG.SERVICE_ID, EMAILJS_CONFIG.TEMPLATE_ID,
        { student_name: studentName, score: score, summary: summary })
        .then(() => { /* invio riuscito: lo studente non vede nulla in più */ })
        .catch(() => showFallback(box, summary));
    };
    script.onerror = () => showFallback(box, summary);
    document.head.appendChild(script);
  } else {
    showFallback(box, summary);
  }
}

// fallback: mostrato SOLO se l'invio automatico fallisce.
// Il riepilogo (con soluzioni) è nascosto in un campo che lo studente
// non deve leggere; serve solo per non perdere i dati in caso di guasto.
function showFallback(box, summary){
  const mailto = 'mailto:' + EMAILJS_CONFIG.TEACHER_EMAIL +
    '?subject=' + encodeURIComponent('Risultati test italiano - ' + studentName) +
    '&body=' + encodeURIComponent(summary);
  box.innerHTML =
    '<div class="card"><p class="note">Nota tecnica: l\'invio automatico non è andato a buon fine. ' +
    'Premi il pulsante per inviare il risultato all\'insegnante.</p>' +
    '<a class="btn" href="' + mailto + '" style="text-decoration:none;display:inline-block;">Invia all\'insegnante</a>' +
    '<textarea id="summaryOut" style="position:absolute;left:-9999px;">' + summary + '</textarea>' +
    '</div>';
}
